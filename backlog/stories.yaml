- id: S0-04
  epic: E0 Data foundation
  phase: '0'
  title: Eligibility-rate table from history
  size: M
  status: done
  depends_on:
  - S0-01
  - S1a-06
  - S1a-07
  spec:
  - 6.3-2
  blocked_by: "No legality surrogate exists to reconstruct against. \xA76.3-2 requires\
    \ applying rules L0\u2013L8 per historical sick call; engine/legality.py is an\
    \ empty stub, and slice 1a only schedules L0 (S1a-06) and L1/L2/L6/L7 (S1a-07)\
    \ \u2014 L3\u2013L5 and L8 aren't scheduled anywhere. tools/validate_corpus.py\
    \ does not reconstruct eligibility either: it reads _ground_truth.json's pre-baked\
    \ eligibility_rate_true and checks it falls in a plausible band, not an independently-computed\
    \ rate. Previously marked done with no test file and no CLI command \u2014 corrected\
    \ 2026-08-06. Re-scope once S1a-06/S1a-07 land: reuse engine/legality.py rather\
    \ than building a second, possibly-diverging surrogate here."
  check:
    auto: pytest tests/data/test_eligibility_table.py
    manual: crewsim data eligibility-target --season winter_sun
    expect: 'a DISTRIBUTION, not a point: mean ~30%, with a confidence interval printed'
    fails_if: "only a single number is printed \u2014 V3 compares distributions, not\
      \ means"
- id: S0-05
