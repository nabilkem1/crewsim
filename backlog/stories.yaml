    \ Confirmed via §5.4 this is not a corpus-generation bug (unlike\
    \ S1d-04b2's D2/D3 boundary issue) -- L5 is explicitly spec'd with a\
    \ conservative bias (\"surrogate-legal ⇒ almost always truly legal\"),\
    \ so some over-rejection relative to the real agreement is expected.\
    \ What's NOT yet established is whether 23.5% is within the range\
    \ that design intent anticipated, or is large enough to suggest the\
    \ 144h/6-day threshold (or the choice to count RESERVE on-call blocks\
    \ toward the streak, same as PAIRING) doesn't match how Air Transat's\
    \ actual day-off rule is defined. S1c-04 itself is unaffected --\
    \ measured directly that drafting/reserve-assignment introduces zero\
    \ new violations and worsens none, so the engine respects whatever\
    \ threshold is ultimately decided here."
- id: S1c-05
  epic: E1c Eligibility
  phase: 1c
  title: "V3 gate \u2014 eligibility rate on the HOLDOUT window"
  size: M
  status: done
  completed: 2026-08-07
  depends_on:
  - S1c-04
  - S0-04
  - S0-09
  spec:
  - '9.2'
  - '6.4'
  gate: V3
  check:
    auto: pytest tests/gates/test_v3_eligibility.py
    manual: crewsim gate v3 --window holdout
    expect: simulated distribution vs the historical band, both plotted; verdict PASS
      or FAIL stated
    fails_if: it passes only on the fitting window, or inputs were tuned until it
      passed
  note: "run_v3_gate/print_v3_report and the CLI wiring were already\
    \ genuinely correct (real simulated distribution, real comparison,\
    \ real verdict, refuses to reach a planner silently) -- the gap was\
    \ entirely upstream, in S0-04's reconstruct_eligibility, which this\
    \ gate depends on entirely for its \"historical band\". See S0-04's\
    \ own note for the full finding: it was a complete fake\
    \ (np.random.binomial(pool_size, 0.30), no real data), now replaced\
    \ with a real historical reconstruction. That fake target is the real\
    \ root of the \"unexplained\" 0.03-vs-0.30 eligibility gap chased\
    \ across S1c-01/02/04 all session.\n\n\
    With the real target in place, V3 genuinely fails, but in the OPPOSITE\
    \ direction from what the fake target implied: simulated (R10 policy,\
    \ holdout) is \u22483.9%, real historical is \u22480.9% -- simulated is too HIGH\
    \ now, not too low. Traced two distinct, real candidate mechanisms\
    \ while investigating (neither pursued further per the user -- see\
    \ below): (1) L3 (rolling 7-day duty/flight limit) is the dominant\
    \ rejection reason in the real historical reconstruction (80% of all\
    \ legality checks), because RESERVE on-call time counts toward the\
    \ 60h/7-day duty cap, so real historical reserves' own on-call\
    \ stretches often already consumed much of their rolling budget; (2)\
    \ R10 (the specific policy this gate's manual check simulates) stages\
    \ 10-12 reserve slots/day, while real D2 history shows only 18 unique\
    \ crew EVER served as reserve across the whole 12-month holdout window\
    \ -- R10 may simply staff more reserves per day than history did,\
    \ independent of any legality question.\n\n\
    Per the user (2026-08-07): ship this as done, don't open a new\
    \ mechanism-investigation story -- the corpus itself is still mock/\
    \ synthetic data (not real Air Transat records), so chasing the exact\
    \ cause of a gap inside mock data isn't worth it now; real numbers\
    \ (and a real answer to which mechanism drives the gap, if any) will\
    \ emerge once real Air Transat data replaces the mock corpus. V3\
    \ correctly reporting FAIL against a now-real historical target is the\
    \ gate doing its job, per this story's own acceptance criteria\
    \ (\"if it fails, the report names the mechanism suspected\") -- not a\
    \ defect in the gate.\n\n\
    Also implemented, since the story's own manual check explicitly says\
    \ 'both distributions plotted' (not just numbers): `write_v3_report`\
    \ renders a self-contained Plotly HTML page (same convention as\
    \ data/profile_html.py) overlaying the simulated and historical\
    \ histograms with the CI band and verdict annotated, written to\
    \ reports_dir and printed by `gate v3`.\n\n\
    Also fixed along the way: `crewsim data eligibility-target --season\
    \ winter_sun` (S0-04's own documented manual check) could never have\
    \ run -- reconstruct_eligibility's second argument is a WINDOW\
    \ (fitting/holdout), not a season; the CLI flag was renamed to\
    \ --window to match what the function actually needs (season is\
    \ already fixed by cfg.scope.season, not a per-call choice).\n\n\
    mypy --strict: eligibility_target.py and gates/v3_eligibility.py are\
    \ outside the enforced crewsim.engine.* scope (pyproject.toml), so not\
    \ policed; roster_loader.py's new `window` parameter is itself clean,\
    \ the file's other pre-existing gaps (predating this story) are\
    \ unchanged, out of scope."
- id: S1c-07
  epic: E1c Eligibility
  phase: 1c
  title: "Cross-base reserve dispatch and the positioning cost it incurs"
  size: L
  status: done
  completed: 2026-08-09
  depends_on:
  - S1c-01
  - S1b-02
  spec:
  - '5.3'
  - '5.8'
  - '7.3'
  - 4.4.2
  check:
    auto: pytest tests/engine/test_positioning.py
    manual: crewsim explain-cost --scenario 0 --category DEADHEAD --trace-root
    expect: "a named crew member, their home base, the station they were flown to,\
      \ the dollar amount, and the open-time item that caused it, traced back to\
      \ its root event"
    fails_if: "the multi-base reserve pool is constructed inside the test instead\
      \ of loaded through load_rosters (a test validating a copy of the mechanism\
      \ rather than the mechanism -- this codebase's most-repeated defect, and here\
      \ it would leave the shipped engine at the same $0 positioning cost it has\
      \ today); or a hotel night is charged on every dispatch (or never) because\
      \ the rule was assumed rather than confirmed; or a TRANSPORT coefficient\
      \ appears in costs_pilots.yaml without a Finance source"
  note: "Opened 2026-08-09. The id and slice were reserved by COVERAGE_AUDIT.md\
    \ (\"S1c-07 | 1c | 5.3, 5.8, 7.3 | Cross-base dispatch + positioning costs\
    \ (theta parameter 2 of 2)\") but the story was never written into either\
    \ backlog surface, so nothing owned it.\n\n\
    Found by the config-consumption guard added in S1c-01's P2 pass:\
    \ positioning.deadhead (400) and positioning.hotel (220) are declared in\
    \ costs_pilots.yaml, parsed by config.py, and booked by nothing. They are the\
    \ only two entries left in config.DECLARED_NOT_YET_CONSUMED with no owning\
    \ story -- disruption.delay_per_minute, the third, belongs to S1d-03. Same\
    \ defect class as the `mode` (S1c-01) and `appr_compensation` (S1b-06) gaps.\n\n\
    Worse than a plain missing feature because gate V6 REPORTS D10's real deadhead\
    \ and hotel invoices on the actuals side of the backtest while the simulated\
    \ side can never produce a matching dollar -- real numbers on screen, coming\
    \ from data rather than from the model, so a reader reasonably concludes\
    \ positioning is priced in. Every scenario needing it is under-costed, in the\
    \ direction that makes reserves look cheaper than they are.\n\n\
    Boundary with S1e-04b: that story owns allow_cross_base_reserve as a GRID AXIS\
    \ -- the restricting direction (filter eligible_reserves to r.base ==\
    \ item.base) plus the four uncoded reserve_selection strategies -- and says\
    \ nothing about booking a cost. S1c-07 owns the opposite direction: reaching\
    \ OUT to another base and paying for it. Landing this retires S1e-04b's\
    \ 'structurally untestable at MVP scope' caveat on its cross-base bullet.\n\n\
    Sized L because of the loader, not the cost: the corpus has three bases (YUL,\
    \ YVR, YYZ in D1/D2) so the data supports it, but cfg.scope.base filters\
    \ load_rosters to YUL, so the loaded reserve pool is single-base and there is\
    \ nothing to dispatch across. Supplying an out-of-scope reserve pool is the\
    \ bulk of the work and must land before the cost can be exercised against\
    \ anything real.\n\n\
    Two domain questions to ASK, not answer (standing rule: never invent a\
    \ modelling parameter for ambiguous domain input): (1) when is a hotel night\
    \ incurred? 7.3's worked example charges deadhead AND hotel together, but a\
    \ same-day out-and-back plainly needs no room -- [CONFIRM: Crew Planning], and\
    \ 400-vs-620 per dispatch is not a rounding difference; (2) TRANSPORT is named\
    \ as a positioning category by 5.8 and carries real rows in D10, but 4.4.2\
    \ prices only deadhead_cost and hotel_cost. Per COVERAGE_AUDIT.md section 3,\
    \ DO NOT invent one -- either Finance supplies it from D10, or 5.8 drops the\
    \ category.\n\n\
    Not opened alongside it: S1c-06 (reserve-selection rules, theta parameter 1 of\
    \ 2), the other id COVERAGE_AUDIT reserved and never wrote. Its substance now\
    \ overlaps S1e-04b's reserve_selection bullet; whether it still needs its own\
    \ card is a separate call.\n\n\
    IMPLEMENTED 2026-08-09. The blocker turned out to be a parameter that had\
    \ existed, unset, since L7 was written: check_l7_base(crew, item,\
    \ is_deadhead=False), docstring 'Crew must start duty at own base unless\
    \ deadheaded'. Nothing had ever passed True, so every out-of-base candidate\
    \ failed L7 by construction -- measured across the real corpus, 0 of 11,393\
    \ covering (crew, duty) pairs were legal, and relaxing the rolling limits only\
    \ moved the rejection from L3 to L7. eligible_reserves now forwards\
    \ is_deadhead, set only on the branch that books the seat.\n\n\
    The pool is loaded, not minted: load_cross_base_reserves reads D2 for the real\
    \ crew who really held RESERVE blocks at other bases (7 at YYZ, 3 at YVR, same\
    \ fleet/position). Their PAIRING blocks are KEPT, unlike the in-scope carve-out\
    \ which strips them -- stripping would invent availability that never existed.\
    \ Positioning is modelled by widening the assignment window rather than bolting\
    \ a cost on, so L1 counts the deadhead hours, L3/L4 accumulate them, the RESERVE\
    \ block must cover the positioning too, and L8 notice is measured to the\
    \ positioning report time.\n\n\
    Two [CONFIRM: Crew Planning] figures asked rather than assumed (recorded with\
    \ the user 2026-08-09, base.yaml -> positioning): deadhead_duration_hours 4.0\
    \ (not derivable -- no base-to-base positioning leg exists anywhere in D1-D12)\
    \ and hotel_on_every_deadhead true (7.3's only worked example charges both as\
    \ one q^pos; D10 shows 247 DEADHEAD vs 250 HOTEL rows). Measured effect: 16\
    \ dispatches across scenarios 0-3 under R6.\n\n\
    Three knock-ons, none cosmetic: (1) gate V1 regressed CORRECTLY -- a zero-reserve\
    \ policy could still be covered by Toronto's reserves, booking a justified\
    \ RESERVE_UTILIZATION that defeats the degeneracy premise; policy_with_reserve_count\
    \ now pins allow_cross_base_reserve=False, same disposition as displaced_flying;\
    \ (2) assign_reserve required only an OVERLAPPING reserve block, not a covering\
    \ one -- harmless before, but it would have positioned crew during hours they\
    \ were not yet on call; (3) gate V6's 'not modelled by the engine' line is no\
    \ longer true, so D10's invoice side now has a simulated counterpart, reported\
    \ beside the gap rather than folded into it (that gap is against D7 PAYROLL).\
    \ That V6 line was a STRUCTURAL $0.00 on first implementation and nearly\
    \ shipped that way: run_historical_replay builds its own Simulation and\
    \ defaulted cross_base_reserves to None, so a number reading as a measurement\
    \ could never be non-zero, printed next to real money -- engine correct,\
    \ replay path unwired. Fixed by threading the pool through\
    \ replay.run_historical_period over that period's own window; pinned by\
    \ test_the_historical_replay_path_also_gets_a_cross_base_pool. V6 for 2026-03\
    \ now reports simulated $2,480.00 against D10's actual $381.78 -- the model\
    \ OVERSTATES positioning ~6.5x on the mock corpus, a V6 finding for whoever\
    \ runs the gate against real data, not a defect in this story.\n\
    Also fixed: explain-cost --category was silently ignored when combined with\
    \ --trace-root, so this story's own manual check would have traced a\
    \ cancellation while appearing to honour the flag.\n\n\
    FOLLOW-UP same day, on the user's instruction: TRANSPORT now books, value to\
    \ be confirmed with Finance. 5.8 named it (ground transport, airport <->\
    \ hotel) while 4.4.2 priced only two of the three positioning categories, so\
    \ the engine held a category it could never book -- 34% of D10's positioning\
    \ spend ($98,624 of $286,965) with no simulated counterpart, which also made\
    \ V6's positioning comparison apples-to-oranges. Placeholder 402.54 =\
    \ arithmetic mean of D10's 245 real TRANSPORT invoices, and its provenance is\
    \ recorded because it is NOT the same kind of number as its neighbours: hotel\
    \ (220) and deadhead (400) are Finance planning rates that do not track D10 at\
    \ all (D10 means 388 and 370), so no ratio can be extrapolated and an invoice\
    \ mean is the only defensible stand-in. Non-round on purpose -- it should read\
    \ as provisional. [CONFIRM: Finance].\n\
    A SECOND [CONFIRM], because the data does not settle the trigger: the obvious\
    \ hypothesis was that transport rides with the hotel, and D10's near-equal row\
    \ counts (247/250/245) look like support. They are NOT -- all 742 D10 rows sit\
    \ on unique (crew, date, pairing) keys and the three cost types never co-occur\
    \ once, so those counts are three independent draws from the mock generator.\
    \ transport_on_every_deadhead is therefore its own knob, defaulted true, not\
    \ welded to hotel_on_every_deadhead. One caveat this creates, printed in V6's\
    \ own output: the three categories now match on both sides so the positioning\
    \ pair is finally like for like, but the transport component of the simulated\
    \ side is a mean OF the actual side it is compared against -- not independent\
    \ until Finance supplies a real rate.\n\n\
    Deliberately not done: 7.3's\
    \ away-from-base DRAFT (the Punta Cana row) books $0, because 'away' is decided\
    \ by crew.base != item.base and a draftee is always in-scope (drafting is\
    \ base-local, 5.6). The wiring is shared, so the follow-up story only has to\
    \ change how 'away' is computed -- D3's layover_stations is where that data is."
