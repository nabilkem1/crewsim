- id: S0-04
  epic: E0 Data foundation
  phase: '0'
  title: Eligibility-rate table from history
  size: M
  status: done
  completed: 2026-08-07
  depends_on:
  - S0-01
  spec:
  - 6.3-2
  check:
    auto: pytest tests/data/test_eligibility_table.py
    manual: crewsim data eligibility-target --window holdout
    expect: "a DISTRIBUTION, not a point: real mean and CI computed from real D4/D2\
      \ history (not ~30% -- that figure was a mock artifact, see note)"
    fails_if: "only a single number is printed \u2014 V3 compares distributions, not\
      \ means"
  note: "Found while implementing S1c-05 (its V3 gate depends on this):\
    \ despite being marked done, `reconstruct_eligibility` was a complete\
    \ fake -- `np.random.binomial(pool_size, 0.30)` with a fixed seed, no\
    \ D1/D2/D3/D4 data touched at all. Its own docstring admitted \"we mock\
    \ a statistically valid simulation of this historical scan\"; its test\
    \ only checked the mock's own hardcoded output (mean near the 0.30 it\
    \ was built to produce); the CLI's `--season winter_sun` flag was\
    \ itself wrong (reconstruct_eligibility's second argument is a WINDOW\
    \ -- fitting/holdout, per S0-09 -- not a season, so the documented\
    \ manual check could never have actually run).\n\n\
    Implemented for real: iterate every real D4 absence in cfg.scope\
    \ (base/fleet/position) and cfg.scope.season, whose crew's real D2\
    \ calendar has a matching PAIRING block; apply the exact same pool +\
    \ legality definition EligibilityEngine.eligible_reserves already uses\
    \ live (pool = other crew whose real RESERVE block covers the whole\
    \ duty window, eligible = pool members passing real\
    \ is_legal_assignment L0-L8) with `now` = the absence's real\
    \ notification_ts. One fraction per historical duty period a real\
    \ absence created open time for -- a real distribution, not a\
    \ synthetic draw. Required widening `load_rosters` (roster_loader.py)\
    \ to accept an explicit `window` parameter (default: the existing\
    \ S1d-04b template window, unchanged for every other caller), since\
    \ this needs real D2 calendars across the WHOLE fitting/holdout span\
    \ (months), not one ~6-week simulation-horizon slice.\n\n\
    Real result: holdout mean \u22480.9% [0.7%, 1.2%] CI from 941 real\
    \ events, fitting mean \u22480.2% from 1682 real events -- both\
    \ dramatically lower than the mock's ~30%, and genuinely DIFFERENT\
    \ from each other (the old mock produced statistically identical\
    \ output for any window, itself a sign it was never touching real\
    \ data). This is the real root of the 'unexplained' eligibility gap\
    \ chased across S1c-01/02/04 all session -- the target itself was\
    \ never real. Per the user (2026-08-07): since the corpus is still\
    \ mock/synthetic data throughout (not real Air Transat records), the\
    \ specific ~30x gap between this real reconstruction and the live\
    \ simulation's ~3-4% isn't worth a deep mechanism investigation right\
    \ now -- real numbers will emerge once real Air Transat data replaces\
    \ the mock corpus. Not tracked as a separate story; see S1c-05's own\
    \ note for the two candidate mechanisms found (L3 counting RESERVE\
    \ on-call time as duty, and R10's staffing level vs. real historical\
    \ staffing) in case they're useful context later."
