    \ `master_key`, and `n_scen`, none of which were ever defined anywhere\
    \ in cli.py. The automated check (tests/gates/test_v7_crn.py) never\
    \ caught this because it kept its OWN separate copy of the same logic\
    \ with its own correctly-defined locals -- exactly the\
    \ test-validates-a-copy-not-the-real-thing pattern found repeatedly\
    \ elsewhere this session. Fixed by extracting one real, shared\
    \ implementation (`gates/v7_reproducibility.py::run_v7_gate`), used by\
    \ both the CLI's `gate v7` dispatch and the test (which now imports it\
    \ instead of keeping a parallel copy). Verified: `crewsim gate v7\
