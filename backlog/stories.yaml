    \ change real rest-hour calculations, not just eligibility counts. SUPERSEDED\
    \ by S1c-07 (done 2026-08-09), and the 'structurally untestable at MVP scope'\
    \ caveat above is now STALE: that story added the out-of-scope reserve pool\
    \ (load_cross_base_reserves reads the real YYZ/YVR reserves from D2) and 5.3's\
    \ XB -> DH dispatch branch with its q^pos cost, and wired L7's long-unset\
    \ is_deadhead parameter. allow_cross_base_reserve now changes both coverage and\
    \ cost (16 dispatches across scenarios 0-3 under R6), so what is left here is\
    \ SWEEPING the axis, not implementing it. The remaining real work on this card\
    \ is the four uncoded reserve_selection strategies.\n  - the\
    \ backlog-vs-spec grid-shape conflict (24 vs 60 combinations, and the missing\
    \ R12 policy file) needs resolving once the other two axes are real, not\
    \ before."
- id: S1e-05
  epic: E1e Reporting
  phase: 1e
  title: "Counterfactual runs \u2014 junior-first and cost-ranked selection"
  size: M
  status: done
  depends_on:
  - S1e-04
  spec:
  - '3'
  - '5.6'
  check:
    auto: pytest tests/test_counterfactuals.py
    manual: crewsim counterfactual --vs-mandated
    expect: the price of the mandated rules, clearly labelled NOT A RECOMMENDATION
    fails_if: a counterfactual can be selected as a candidate policy
  note: "Implemented 2026-08-08. junior_first already existed as an unused parameter\
    \ on drafting.py::select_draft_candidate (found, not written this story) \u2014\
    \ des.py's call site never passed it through. Wired a new draft_mode: str =\
    \ \"mandated\" parameter through Simulation/run_scenario/run_policy_crn\
    \ (\"mandated\" | \"junior_first\" | \"myopic_total_cost\", default \"mandated\"\
    \ so every existing caller is unaffected) and dispatched it in\
    \ _attempt_resolution.\n\nFound a real gap while verifying the AC's own\
    \ \"structurally impossible to select as a candidate policy\" language: Policy/\
    \ Stage2Config were plain pydantic BaseModels with no extra=\"forbid\", so a\
    \ policy YAML carrying e.g. junior_first: true would validate successfully and\
    \ be silently ignored \u2014 safe (never read), but not the loud rejection the\
    \ AC implies. Fixed by adding extra=\"forbid\" to every model in policy.py\
    \ (matching config.py's own _Model convention), verified all 5 real policy\
    \ files still load and that an extra key now raises ValidationError.\n\n`myopic_total_cost`\
    \ (\"Pure Cost-Ranked\", spec \u00a73) needed a \"predicted cascade cost\" per\
    \ candidate with no existing dollar figure to source it from \u2014 presented via\
    \ AskUserQuestion (count x base_premium vs. real one-step lookahead vs. park it).\
    \ User chose count x base_premium: predicted_cascade_cost = len(cascaded_items)\
    \ * costs.draft.base_premium, where cascaded_items comes from cascade.py's\
    \ already-existing compute_draft_delta (pure, no mutation \u2014 safe to call once\
    \ per legal candidate purely to rank them). Implemented in new\
    \ src/crewsim/engine/counterfactuals.py::select_myopic_total_cost, kept OUT of\
    \ drafting.py deliberately (drafting.py stays about the one real mandated\
    \ algorithm plus the junior_first flag; counterfactuals.py owns every\
    \ NOT-A-RECOMMENDATION strategy).\n\nnew src/crewsim/reporting/counterfactual.py\
    \ (run_counterfactual_comparison \u2014 same policy's stage1 reserves, same CRN\
    \ scenario set, all 3 draft_modes; print_counterfactual_report) and\
    \ `crewsim counterfactual --vs-mandated --policy --scenarios --master-seed` CLI\
    \ subcommand, NOT_A_RECOMMENDATION label printed at both the top and bottom of\
    \ the report (spec's own \"NOT A RECOMMENDATION\" requirement, not easy to miss\
    \ by scrolling past one printed line).\n\n**Real, measured finding:** at this\
    \ corpus/policy scale (R6, real scenarios), E[cost] came out IDENTICAL to the\
    \ cent across all 3 draft_modes despite genuinely different crew being drafted\
    \ (verified directly \u2014 senior-first and junior-first drafted different real\
    \ crew_id sequences). Root cause, not a bug: every draft observed (196/196 in\
    \ one real scenario) was satisfied from tier 1 (day-off candidates, tier_cost=0),\
    \ so reordering WHO is picked within a non-empty tier never changes the tier\
    \ used, hence never changes total dollar cost \u2014 only WHO earns the premium\
    \ (matches spec \u00a75.6's own framing: \"read as the distribution of premium\
    \ earnings, not an imposed burden\"). The rule has a real, nonzero price only in\
    \ scenarios where tier 1 is exhausted. print_counterfactual_report shows the\
    \ per-tier draft breakdown alongside the cost table and states this explicitly\
    \ rather than presenting an unexplained $0.00 delta \u2014 same discipline as the\
    \ flat E[cost]-across-R finding in S1e-02/03.\n\nStructural-impossibility test\
    \ (tests/test_counterfactuals.py::test_draft_mode_rejected_by_policy_schema):\
    \ injects junior_first/myopic_total_cost/draft_mode into a real loaded policy's\
    \ stage2 dict and asserts Policy(**data) raises ValidationError for each. Also\
    \ tests: junior_first genuinely selects a different real crew sequence (not a\
    \ no-op), myopic_total_cost prefers a real tier-1 candidate over a real,\
    \ equally-legal tier-2 candidate (both verified individually legal via\
    \ is_legal_assignment, so the test exercises tier comparison, not an accidental\
    \ legality filter), and CRN pairing across draft_modes. Full suite 253\u2192259+\
    \ (6 new tests here + the extra=\"forbid\" hardening), 0 regressions.\n\nAlso\
    \ resolved this session's parallelism question for S1e-05/06/07 via\
    \ AskUserQuestion: sequential, not parallel agents \u2014 S1e-07 hard-depends on\
    \ S1e-06's replay infrastructure, and S1e-05/S1e-06 both edit des.py/cli.py, so\
    \ concurrent agents risked a conflicting merge costing more than the wall-clock\
    \ saved."
- id: S1e-06
  epic: E1e Reporting
  phase: 1e
  title: V5 trace export for the SME walkthrough
  size: M
  status: done
  depends_on:
  - S1e-03
  spec:
  - '9.2'
  gate: V5
  check:
    auto: pytest tests/gates/test_v5_trace.py
    manual: crewsim gate v5 --week 2026-01-12 --format timeline
    expect: "an hour-by-hour operational timeline, readable by a duty manager \u2014\
      \ not a log dump"
    fails_if: it reads as debug output; you get one hour of an SME's attention, spend
      it well
  note: "Implemented 2026-08-08. Genuinely un-passable as a real V5 gate in the\
    \ spec's own sense: PASS requires a human IOC duty manager saying \"yes, I would\
    \ have done this\" in a real walkthrough \u2014 no code in this repo can self-certify\
    \ that. This story builds the ARTIFACT that walkthrough needs (a real replay +\
    \ a readable timeline), and says so explicitly in the module docstring and every\
    \ CLI invocation; it never claims a PASS it can't back.\n\nUser-confirmed disposition\
    \ (this session's AskUserQuestion round, alongside S1e-05/07's scoping): the\
    \ corpus is entirely mock (tools/generate_mock_corpus.py generates D1-D12), so\
    \ there is no real \"memorable January ice storm\" to replay \u2014 use the mock\
    \ corpus's own highest-disruption week instead, labelled as such everywhere it\
    \ appears (never presented as real history).\n\nNew src/crewsim/engine/replay.py,\
    \ deliberately separate from des.py's run_scenario/run_policy_crn \u2014 those draw\
    \ sick-call arrivals from the NHPP scenario cache keyed by (master_seed,\
    \ scenario_id), never by a real calendar date; V5 needs the opposite. Reused\
    \ roster_loader.load_rosters's existing window param (already built for S0-04's\
    \ historical eligibility reconstruction) to load a real, calendar-anchored 7-day\
    \ roster slice. find_peak_disruption_week groups real D4 absences (scope-filtered\
    \ to cfg.scope first \u2014 confirmed base/fleet/position=YUL/A321neoLR/FO is D4's\
    \ single LARGEST group, 1443 rows, before writing this) by ISO Monday-week and\
    \ returns the max. Simulation.real_absence_source (des.py) replaces the random\
    \ sick_call_source entirely with a new deterministic generator reading real D4\
    \ rows \u2014 notification_ts (real report time) drives when each OpenTimeItem\
    \ surfaces, [absence_start, absence_end) (also real) is the window searched for\
    \ broken pairings \u2014 two distinct real timestamps D4 already carries, which\
    \ the synthetic generator conflates into one draw but real data doesn't have to.\
    \ Found mid-implementation that this generator (and the env/Simulation\
    \ construction around it) MUST live in des.py, not replay.py \u2014 S0-00b's\
    \ dependency rule (\"only des.py may import simpy\", enforced by\
    \ tests/test_dependency_rule.py) caught it immediately. Restructured: replay.py\
    \ now only prepares data (which week, which real D4 rows, the calendar-anchored\
    \ roster) and calls a new des.run_historical_week; apply_named_absence lives in\
    \ sick_calls.py as apply_sick_call's sibling (shares a new _break_pairings\
    \ helper for the deadline-calc/OpenTimeItem-construction logic both need).\
    \ Extracting that helper surfaced a separate real, pre-existing gap: apply_sick_call\
    \ never set OpenTimeItem.flight_mins (always the dataclass default 0.0), unlike\
    \ cascade.py's own item construction \u2014 legality.py's rolling-flight-hour\
    \ check has been undercounting sick-call-origin items' added flight time since\
    \ S1b-04. Deliberately NOT fixed here (documented instead, in _break_pairings'\
    \ own docstring): changing it would alter every existing CRN scenario's legality\
    \ outcomes, well outside this story's scope \u2014 flagged as a future story\
    \ candidate, not silently patched. apply_named_absence duplicates\
    \ apply_sick_call's selection logic deliberately rather than unifying it further\
    \ \u2014 the semantics genuinely differ (named crew + real window vs. random crew\
    \ + duration-based search) and
    \ the well-tested random path must not risk any behavioural change.\n\nAdded\
    \ Simulation.verbose_trace (new, separate from the existing `trace` flag) so\
    \ S1e-06's heavier per-decision logging never affects S1e-02/03's existing\
    \ trace=True callers (report/drilldown) \u2014 only replay.py's direct Simulation\
    \ construction sets it. When True, _attempt_resolution logs the FULL alternative\
    \ set for every decision, not just the outcome (this story's own AC):\
    \ RESERVE decisions show every on-call reserve's real legality verdict\
    \ (fail_rule/reason verbatim from legality.py, not paraphrased) for whoever was\
    \ on-call but rejected; DRAFT decisions show real tier sizes and the chosen\
    \ candidate's real seniority rank within their tier (not every candidate's name\
    \ \u2014 a tier can hold dozens of real day-off crew, and an SME's hour is better\
    \ spent on which tier was reached than a name dump).\n\nnew src/crewsim/gates/v5_trace.py\
    \ (format_timeline \u2014 groups sim.trace into hour-by-hour buckets anchored to\
    \ the real week's Monday 00:00, MOCK_DATA_CAVEAT printed at the top of every\
    \ export; run_v5_gate) and `crewsim gate v5 --week --format timeline --policy`\
    \ CLI dispatch \u2014 --week accepts an explicit ISO date (the story's own literal\
    \ syntax still works) or, if omitted, defaults to find_peak_disruption_week.\n\n\
    tests/gates/test_v5_trace.py: cross-checks the peak-week finder against an\
    \ independent manual aggregation; proves NO synthetic arrivals leak into the\
    \ replay by verifying every 'REAL ABSENCE' trace line's absence_id is a real\
    \ D4 row for that exact week/scope (the blocking risk identified before writing\
    \ any replay code \u2014 sick_call_source must never also run alongside the\
    \ deterministic source); verifies hour-grouping and the mock-data caveat; verifies\
    \ real rejection reasons (ILLEGAL_L3 etc., verbatim from a real legality check,\
    \ not a fixture) appear when a real on-call reserve was actually rejected.\n\n\
    Two real bugs found reviewing the shipped output against this story's own AC\
    \ (\"each decision shows the alternatives considered and why they were\
    \ rejected\") before calling it done:\n  1. A pairing that started BEFORE the\
    \ replay window (a duty already mid-flight when the week begins \u2014 the loaded\
    \ calendar still includes it, since roster_loader.load_rosters's window param\
    \ returns any block OVERLAPPING the window, not just ones starting inside it)\
    \ produced an item whose deadline was already in the past at sim time 0 \u2014\
    \ instant cancellation, zero recovery attempt, nothing for the timeline to\
    \ show. Fixed: apply_named_absence now excludes any block with b.start < 0.\
    \ The normal CRN engine (apply_sick_call) never hits this case \u2014 every item it\
    \ creates already has item.start within the same horizon its \"now\" is\
    \ measured against.\n  2. Separately, an item that legitimately finds ZERO\
    \ eligible reserves AND zero legal draft candidates at a real retry checkpoint\
    \ produced no trace line at all before its eventual cancellation \u2014 a real,\
    \ reachable decision (\"we looked, found nobody\") with nothing shown, which\
    \ is exactly the silent gap this AC exists to prevent. Fixed: _attempt_resolution\
    \ now logs this case explicitly under verbose_trace.\n\nBoth fixed and covered\
    \ by new regression tests (tests/engine/test_sick_calls.py, 2 new; a 3rd in\
    \ test_v5_trace.py scanning every real 'CANCELLED at deadline' line for\
    \ preceding reasoning). Re-verified both manual-check forms after the fixes:\
    \ the story's own literal `--week 2026-01-12` and the confirmed default\
    \ (peak-disruption week, currently 2026-02-23) both produce a clean timeline\
    \ with no unexplained cancellations. Full suite 259\u2192268 (9 new tests: 5 in\
    \ test_v5_trace.py + test_cli_gate_v5 + 3 regression tests for the two bugs\
    \ above), 0 regressions."
- id: S1e-07
  epic: E1e Reporting
  phase: 1e
  title: V6 cost backtest against actuals
  size: L
  status: done
  depends_on:
  - S1e-06
  spec:
  - '9.2'
  gate: V6
  check:
    auto: pytest tests/gates/test_v6_backtest.py
    manual: crewsim gate v6 --period 2026-01
    expect: simulated vs actual cost, plus the bias decomposition from 9.2's table
    fails_if: "it lands inside tolerance with no decomposition \u2014 offsetting biases\
      \ prove nothing"
  note: "Implemented 2026-08-08. Same un-passable-as-a-real-gate disposition as\
    \ S1e-06: PASS requires comparing against REAL D7 payroll/D10 invoices, which\
    \ don't exist in this repo \u2014 only tools/generate_mock_corpus.py's generated\
    \ ones do. User-confirmed disposition (this session's AskUserQuestion round,\
    \ the non-default choice): build the real backtest MECHANICS now against mock\
    \ data, always labelled MOCK CORPUS DATA at the top and bottom of every report,\
    \ rather than parking the story \u2014 so it's ready to run for real the moment\
    \ real payroll/invoice data exists.\n\nGeneralized S1e-06's replay path from a\
    \ fixed 7-day week to an arbitrary date range: des.run_historical_week renamed\
    \ to des.run_historical_replay (period-agnostic, horizon_minutes is whatever\
    \ span the caller prepared roster/reserves/absences for); replay.py gained\
    \ run_historical_period(cfg, costs, policy, period_start, period_end, trace,\
    \ verbose_trace) as the new general entry point, with run_historical_week kept\
    \ as a thin wrapper (always trace=True/verbose_trace=True, since an SME\
    \ walkthrough always wants full alternative-set logging) so S1e-06's own\
    \ tests/CLI path is untouched. V6 calls run_historical_period directly with\
    \ month_bounds(period) and trace=False/verbose_trace=False \u2014 a full-month\
    \ backtest has no SME audience and would otherwise log every decision for 31\
    \ days.\n\nNew src/crewsim/gates/v6_backtest.py: month_bounds (\"YYYY-MM\" ->\
    \ [first day, first day of next month)); compute_actual_cost sums real D7 rows\
    \ by pay_code for cfg.scope's crew_ids in that pay_period, plus D10 positioning\
    \ invoices for the same crew/date range (reported separately, since the engine\
    \ doesn't model positioning cost at all); compute_simulated_cost sums the\
    \ replay's own ledger by category; run_v6_gate computes the gap and gap_pct\
    \ between the two comparable totals; print_v6_report renders both totals, the\
    \ gap, what's excluded from each side and why, and spec 9.2's own bias-\
    \ decomposition table verbatim (SPEC_BIAS_DECOMPOSITION \u2014 qualitative\
    \ OVERSTATES/UNDERSTATES statements, not computed values, matching this story's\
    \ own fails_if).\n\nReal bug found before calling this done: the first version\
    \ matched sim ledger categories against a flat dict with exactly two keys\
    \ (RESERVE_STAFFING, RESERVE_UTILIZATION) mapped to their D7 pay_codes, but\
    \ des.py books draft costs under a dynamic f\"DRAFT_TIER{tier}\" category name\
    \ (tier 1-5) that matched no key at all \u2014 every draft cost was silently\
    \ dropped from BOTH the comparable total and the excluded-costs breakdown, so\
    \ the printed report simply never accounted for them anywhere. Found by manual\
    \ smoke-test: the \"Excluded\" section's total didn't visibly include the drafts\
    \ a disruption month obviously produces. Fixed with _pay_code_for_sim_category(),\
    \ which special-cases the DRAFT_TIER prefix -> D7's single DRAFT_PREM pay_code\
    \ (D7 doesn't break draft premium out by impact tier, so neither does this\
    \ comparison). Covered by a dedicated regression test\
    \ (test_draft_costs_are_not_silently_dropped_from_the_comparison).\n\nSecond\
    \ finding, non-blocking: for 2026-01 the printed gap is large (simulated >>\
    \ actual) because only ~21 of 120 in-scope crew have ANY D7 row that month \u2014\
    \ verified this is real fixture behaviour, not a scope-filter bug\
    \ (tools/generate_mock_corpus.py only emits D7 rows for RESERVE_UTIL/DRAFT_PREM/\
    \ RESERVE_GTE EVENTS, never a full payroll register, and there are zero\
    \ ALL-fleet crew at the YUL/A321neoLR/FO scope that could be getting dropped).\
    \ Since a bare gap % next to a sparse actual total invites being misread as a\
    \ calibration signal, print_v6_report now also states n_crew in scope, how many\
    \ of them have any comparable D7 row, and the row count backing that \u2014 so\
    \ the sparsity is visible, not just correct.\n\ntests/gates/test_v6_backtest.py\
    \ (6 tests): month_bounds; compute_actual_cost cross-checked against an\
    \ independent manual D7 aggregation; a real disruption month produces a nonzero\
    \ comparable gap; the DRAFT_TIER regression test above; excluded costs\
    \ (CANCELLATION/TERMINAL_PENALTY on the sim side, D10 positioning on the actual\
    \ side) are present in the result, not silently dropped; print_v6_report shows\
    \ the MOCK_DATA_CAVEAT at both top and bottom plus every SPEC_BIAS_DECOMPOSITION\
    \ row. Plus test_cli_gate_v6 and test_cli_gate_v6_requires_period (exit code 2\
    \ with a clear message when --period is omitted) in tests/test_cli.py.\n\n\
    Re-verified the story's own literal manual check, `crewsim gate v6 --period\
    \ 2026-01` (default --policy, no other flags), after all fixes \u2014 clean\
    \ output, correctly labelled. mypy --strict src/crewsim/engine/ unchanged at\
    \ 17 pre-existing errors. Full suite 268\u2192276 (8 new tests: 6 in\
    \ test_v6_backtest.py + 2 in test_cli.py), 0 regressions."
