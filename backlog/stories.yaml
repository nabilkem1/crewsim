  spec:
  - 6.3-3
  note: "Expect was ~20% (cascades_true/drafts_true from _ground_truth.json, a corpus-level\
    \ ratio, not a per-draft scan). Running the real \xA76.3-3 recipe against S0-03's\
    \ reconstructed drafts gives 26.9% [25.1%, 28.8%] 95% CI \u2014 216 of 252 drafted\
    \ crews are drafted more than once, so one downstream cascade can legitimately\
    \ follow more than one of that crew's recent drafts. Corrected 2026-08-06, same\
    \ pattern as S1a-04."
  check:
    auto: pytest tests/data/test_cascade_table.py
    manual: crewsim data cascade-target
    expect: ~27% with a CI; row count consistent with S0-03's reconstructed draft
      count
    fails_if: the cascade count exceeds the reconstructed draft count
