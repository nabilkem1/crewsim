  note: "Implemented 2026-08-07. Scoped to this story's own 3 acceptance\
    \ criteria, not spec \u00a79.3's full 5-item epic-level obligation (item\
    \ 1, drill-down links, is explicitly S1e-03's own card, which depends on\
    \ this one).\n\n\
    `crewsim report --policies <names> [--scenarios N] [--open]` writes one\
    \ self-contained HTML file (`output/reports/policy_report.html`,\
