    \ both checks before touching anything, per that same practice.\n\n\
    Automated check was genuinely broken: `pytest\
    \ tests/engine/test_eligibility.py::test_full_mode_eligibility` failed\
    \ with `ValueError: L3 check requires legality configuration in cfg` --\
    \ the test built `EligibilityEngine(mode=\"FULL\")` with no cfg, which\
    \ used to be fine before L3/L4/L8 started requiring one (des.py's own\
    \ production code already passes cfg correctly: `EligibilityEngine(mode=\
    \ \"FULL\", cfg=cfg)`). This was the session's `test_full_mode_eligibility`\
    \ failure carried as \"pre-existing, unrelated\" since the very start --\
    \ turned out to be this story's own broken check the whole time. Fixed\
    \ by adding a local `_test_cfg()` fixture (same shape and values as\
    \ test_legality.py's own, which already exists for exactly this reason)\
    \ and passing it to the constructor -- no production-code change needed\
    \ for this part; the original test's own assertions (elig=[R001],\
    \ fraction=0.5) held once cfg was supplied, confirming they were correct\
    \ all along.\n\n\
    Manual check (`--report-eligibility`) didn't exist as a CLI flag at all.\
    \ Wired it into `run`: prints a real 10-bucket histogram (not a mean) of\
    \ `sim.elig.get_distribution()` flattened across the CRN loop's scenarios\
    \ -- ran the story's own 200-scenario bar for real (109,449 events,\
    \ mean=0.038, clearly non-degenerate shape). Also fixed `run --policy` to\
    \ accept a bare policy name (`R10`), matching `compare`/`gate v3`/`gate\
    \ v4`'s existing convention -- the story's own manual check\
    \ (`--policy R10`) had never actually worked, since `run` only ever\
    \ accepted a full path.\n\n\
    While verifying the acceptance criteria word-for-word (not just running\
    \ the checks), found the FIRST criterion wasn't actually met: \"Pool =\
    \ reserves whose RESERVE block covers the duty window\" -- but\
    \ eligibility.py's own comment said \"at the moment of the report time\
    \ (item.start)\", and the code only checked `blocks_in(item.start,\
    \ item.start)`, a single point, not the interval [item.start, item.end].\
    \ A reserve whose on-call window ended a minute after report time would\
    \ have been incorrectly counted as pool-eligible. Fixed: pool membership\
    \ now requires the RESERVE block's [start, end] to fully contain\
    \ [item.start, item.end]. Added\
    \ test_pool_requires_coverage_of_whole_duty_window pinning this exactly\
    \ (a reserve covering only item.start is excluded; one covering the whole\
    \ window is included) -- the existing test's assertions were unaffected\
    \ (both its reserves already covered the full window). This is a real\
    \ behavior change to des.py's reserve-resolution path, not a test-only\
    \ fix; full suite re-run confirmed no regressions.\n\n\
    Brought eligibility.py to mypy --strict + ruff clean while in the file\
    \ (missing __init__ return type, implicit-Optional rng default,\
    \ deprecated typing.List) -- it's the module this story owns, and none of\
    \ those were touched by anyone else this session."
