- id: S1d-04b2
  epic: E1d Cascades
  phase: 1d
  title: "Fix mock-corpus generator: D2 PAIRING blocks vs D3 duty-period timing"
  size: S
  status: done
  completed: 2026-08-07
  depends_on:
  - S1d-04b
  spec:
  - '5.3'
  - '4.3'
  note: "Discovered 2026-08-07 implementing S1d-04c: legality.py's L1 (13h max\
    \ duty) fails for every D2 PAIRING block by construction, because D2 rolls\
    \ up a whole multi-day trip (48-120h) into one block. Fix: decompose PAIRING\
    \ into D3's real per-duty-period spans (report_local..release_local, ~4-9h)\
    \ via a new roster_loader.py::_load_pairing_duty_periods. That surfaced a\
    \ second, larger problem: replacing D2's block with D3's real timing made\
    \ 62.4% of crew (368/590) fail L0 (calendar overlap) \u2014 87% of conflicts\
    \ were the PAIRING's real last release spilling past D2's own end boundary\
    \ into whatever D2 scheduled next (DAY_OFF/VACATION/TRAINING/RESERVE/\
    \ SIMULATOR); the rest were consecutive same-pairing duty periods overlapping\
    \ (an overnight duty's real release landing after the next day's independently-\
    \ sampled report time). First diagnosed this as rare cross-pairing noise\
    \ (0.16% of transitions) and shipped a CALENDAR_CONFLICT exclusion bucket to\
    \ paper over it \u2014 wrong: re-measured directly against the real load_rosters\
    \ logic and found the true rate was 62.4%, not 0.16%. Reverted that exclusion\
    \ (L0 raises again) before doing anything else, per standing practice of not\
    \ letting a wrong diagnosis's fix mask a systemic problem as \"excluded crew\".\
    \ Presented the corrected finding to the user with three options (D3\
    \ authoritative / D2 authoritative / regenerate the corpus); user chose to\
    \ fix the root cause at generation time (tools/generate_mock_corpus.py).\
    \ Fix: (1) _make_pairing now returns the true last-release datetime, and the\
    \ D2 PAIRING block's day-span is padded (via math.ceil) so D2 always fully\
    \ contains D3's real timing, with the roster-generation walk cursor advanced\
    \ past that padded end rather than the naive day count \u2014 eliminates the\
    \ 62.4% case entirely, verified (0 conflicts, was 62.4%). (2) each day's\
    \ report time is floored to (previous overnight duty's real release + the\
    \ same 0.5h buffer already used elsewhere in this function for release\
    \ padding, not a new invented constant) when that duty spilled into the\
    \ current day \u2014 eliminates the residual same-pairing overlap case\
    \ (was 802/399913 duty-period pairs, 6.95% of crew; now 0). Corpus regenerated\
    \ with unchanged seed/months (configs/base.yaml defaults); _ground_truth.json\
    \ updated accordingly since pairing/duty counts shift slightly."
  check:
    auto: pytest tests/engine/test_roster_loader.py
    manual: crewsim roster summary --base YUL --fleet A321 --position FO
    expect: load_rosters() runs to completion with zero L0 (calendar overlap)
      violations across the full corpus, no CALENDAR_CONFLICT exclusion needed
    fails_if: any crew member's calendar has two blocks where the later one
      starts before the earlier one ends
- id: S1d-04c
  epic: E1d Cascades
  phase: 1d
  review_2026_08_09: "Epic E1d code review. P0: v4_cascade read draft_recall['rate'] -- score_recall returns 'recall', so the lookup hit its 1.0 default on every run and AC3's marginal-recall warning never fired once, while holdout recall is actually 0.000 (0 of 2584 drafts). It survived because the test hand-built the same wrong key. Fixed; _recall_of now raises on an unrecognised shape, and one test drives the real cascade_target. P0: the verdict was containment in a zero-width [0,0] band -- meaningless either way; V4 now returns INCONCLUSIVE naming the historical-side blocker. P1: S1d-02's reserve-loss cascade was counted by nothing and is unreachable from the draft pool (line holders have RESERVE stripped) -- counters added, unreachability pinned by a test. P1: explain-cost --category TERMINAL_PENALTY exited 1 for a category that simply never fires; ledger.BOOKABLE_CATEGORIES now separates 'did not happen' from 'cannot exist'. P2: explain-cascade ignored --scenario and cited a now-false 'cascades never fire' premise (4.2% do); it traces a real cascade now. P2: config.py misattributed delay_per_minute to S1d-03 (it is E2, S1b-09). P3: epic header said 9 stories, there are 12; S1d-01b's duplication was collapsed by S1a-07; S1d-04c/04d limitation sections were stale."
  title: "des.py: single-scenario recovery pipeline (reserve \u2192 draft \u2192 cascade \u2192 E8 \u2192 cancel)"
  size: M
  status: done
  completed: 2026-08-07
  depends_on:
  - S1d-04b
  - S1d-04b2
  spec:
  - '5.3'
  - '4.3'
  note: "Narrowed 2026-08-07 on advisor review from the original 'wire the whole\
    \ DES loop' story: bundling the recovery pipeline with the CRN multi-scenario\
    \ loop and the CLI rewiring meant a wrong aggregate number could come from\
    \ either. Split into this story (one scenario, one policy, a printable\
    \ ledger) and S1d-04d (the CRN loop + crewsim run/compare/gate v3/v4).\
    \ crewsim_skeleton.py's IOCSimulation class is the control-flow reference\
    \ (reserve-first -> draft -> cascade re-enqueue -> cancel) \u2014 real engine/*\
    \ modules replace its simplified inline legality/cascade/draft-selector/\
    \ eligibility logic. Confirmed before starting: copy.deepcopy is required\
    \ per scenario (dataclasses.replace silently drops roster_loader's dynamic\
    \ _is_reserve attribute); 8/12 reserves in the current window carry both SC\
    \ and LC blocks so RESERVE_STAFFING must be booked per reserve PER DAY off\
    \ that day's actual block type, not a per-crew SC/LC classification (which\
    \ isn't well-defined); the sick-call duration needed by sick_calls.py's\
    \ duration_days is real calibrated data (output/params/params_v*_winter_sun.json\
    \ -> sick_call_nhpp.duration_lognorm_shape/scale from S0-07), not invented.\
    \ E8 (hold-until-deadline, re-attempt as state changes) is IN SCOPE per the\
    \ user: re-check times are the reserve pool's own future RESERVE-block start\
    \ times up to the item's deadline \u2014 non-arbitrary, derived from already-loaded\
    \ calendar data, not a polling interval invented for convenience. Known,\
    \ deliberately out-of-scope defect surfaced while doing this: sick_calls.py\
    \ (S1b-04, marked done) breaks a sick crew member's pairings but never marks\
    \ them unavailable, so they remain fully draftable during their own sick\
    \ leave -- called as-is, not patched here.\n\n\
    Closed out 2026-08-07 after S1d-04b2 unblocked it. `des.py`'s `Simulation`\
    \ class and `run_scenario()` were already fully written; finishing the\
    \ story meant: (1) `tests/engine/test_des.py` (6 tests -- every item\
    \ resolves, mixed reserve/draft/cancel outcomes not a degenerate all-cancel\
    \ pipeline, CRN reproducibility under a fixed master_seed, a different\
    \ master_seed changes the outcome, cascade items get distinct nonzero uids,\
    \ trace only populates when trace=True); (2) `crewsim explain-recovery\
    \ --scenario --policy --master-seed --trace` wired into cli.py, printing\
    \ the step-by-step trace and ledger totals from a real `run_scenario()`\
    \ call; (3) mypy --strict clean on des.py -- added scipy-stubs (matching\
    \ the existing types-PyYAML precedent) since des.py is the first\
    \ crewsim.engine.* module to import scipy under the strict override,\
    \ annotated the 3 SimPy generator methods, and narrowed `cfg.cascade`\
    \ from `CascadeConfig | None` once in __init__ instead of re-asserting it\
    \ per method; (4) closed the ALLOWLIST/magic-number gap in\
    \ tests/test_config.py for des.py's genuinely structural constants\
    \ (1440.0/60.0 time conversions, 16 blake2b digest_size, the 11/10 hour\
    \ (x60) min-rest figures duplicating legality.py's already-allowlisted L2\
    \ constants because events.py::assign_reserve takes min_rest as a\
    \ caller-supplied value, 3/5 draft tiers matching drafting.py's own\
    \ entries). One constant was NOT allowlisted: the 0.5-day sick-call\
    \ duration floor was a genuine unasked business parameter (the S0-07\
    \ lognormal fit's support runs down near 0) -- confirmed with the user,\
    \ moved to `calibration.sick_call_min_duration_days` in configs/base.yaml\
    \ rather than hidden in code.\n\n\
    Advisor caught a vacuous test: the corpus-driven tests never produced\
    \ n_cascading_drafts > 0 across 20 master_seeds under the real corpus +\
    \ R10 policy (148-crew roster) -- select_draft_candidate always finds a\
    \ tier-1 (day-off) candidate before tier-2 (conflicting future pairing) is\
    \ ever needed, so the cascade branch in _attempt_resolution/_delayed_pipeline\
    \ was never exercised by those tests, even though\
    \ test_cascade_items_get_distinct_nonzero_uids's assertion looked\
    \ meaningful. Not a code defect (compute_draft_delta's cascade logic is\
    \ independently verified by tests/engine/test_cascade.py) -- a genuine\
    \ emergent property of this roster size/demand ratio, worth knowing for\
    \ S1d-04 (V4 cascade gate) too, since it implies cascades may be similarly\
    \ rare at this scale in that gate's own numbers. Closed the test gap\
    \ directly: added test_cascade_path_fires_end_to_end, a single-candidate\
    \ synthetic roster whose only legal draft choice also holds a future\
    \ pairing inside the drafted duty's mandatory-rest window, forcing the\
    \ cascade branch through the real Simulation object (not compute_draft_delta\
    \ in isolation). It caught a real bug in its own first draft (a manually\
    \ assigned item.uid=1 collided with next_uid()'s first cascade uid because\
    \ the test hadn't advanced sim._uid the way sick_call_source does) --\
    \ fixed before landing, which is itself evidence the assertion is not\
    \ vacuous.\n\n\
    Known, NOT fixed here: Simulation.sick_call_source generates arrivals\
    \ across the entire horizon (warmup+measurement+cooldown), not just\
    \ warmup+measurement -- configs/base.yaml's own cooldown_days comment\
    \ (\"lets late cascades realise their cost\") reads as cooldown being a\
    \ drain period for events already in flight, not a window with its own\
    \ fresh arrivals. Found during S1d-04d while reasoning about\
    \ measured_window_costs; left as a documented limitation since it changes\
    \ already-done S1d-04c behavior, not S1d-04d's own scope."
  check:
    auto: pytest tests/engine/test_des.py
    manual: crewsim explain-recovery --scenario 0 --trace
    expect: "one legible trace: an OpenTimeItem enters, reserve/draft/cascade/\
      \ hold/cancel resolution is shown step by step with real crew ids and real\
      \ costs from configs/costs_pilots.yaml, not placeholder numbers"
    fails_if: "the same OpenTimeItem's outcome is unchanged when configs/costs_pilots.yaml\
      \ or configs/base.yaml legality limits are edited"
- id: S1d-04d
  epic: E1d Cascades
  phase: 1d
  review_2026_08_09: "Epic E1d code review. P0: v4_cascade read draft_recall['rate'] -- score_recall returns 'recall', so the lookup hit its 1.0 default on every run and AC3's marginal-recall warning never fired once, while holdout recall is actually 0.000 (0 of 2584 drafts). It survived because the test hand-built the same wrong key. Fixed; _recall_of now raises on an unrecognised shape, and one test drives the real cascade_target. P0: the verdict was containment in a zero-width [0,0] band -- meaningless either way; V4 now returns INCONCLUSIVE naming the historical-side blocker. P1: S1d-02's reserve-loss cascade was counted by nothing and is unreachable from the draft pool (line holders have RESERVE stripped) -- counters added, unreachability pinned by a test. P1: explain-cost --category TERMINAL_PENALTY exited 1 for a category that simply never fires; ledger.BOOKABLE_CATEGORIES now separates 'did not happen' from 'cannot exist'. P2: explain-cascade ignored --scenario and cited a now-false 'cascades never fire' premise (4.2% do); it traces a real cascade now. P2: config.py misattributed delay_per_minute to S1d-03 (it is E2, S1b-09). P3: epic header said 9 stories, there are 12; S1d-01b's duplication was collapsed by S1a-07; S1d-04c/04d limitation sections were stale."
  title: "CRN scenario loop + crewsim run/compare/gate v3/v4 off their mocks"
  size: M
  status: done
  completed: 2026-08-07
  depends_on:
  - S1d-04c
  spec:
  - '5.3'
  - '4.3'
  note: "The other half of the original S1d-04c: run the S1d-04c pipeline across\
    \ N CRN-paired scenarios per policy (crn.generate_streams, deep-copying the\
    \ roster per scenario), aggregate E[cost]/CVaR95, and replace cli.py's\
    \ mocked `compare` (np.random Gaussians) and gate v3/v4's hardcoded\
    \ sim_fractions/sim_cascade_rates with real output from this loop. This is\
    \ what actually makes S1a-12's and S1d-04's manual checks (both marked done)\
    \ mean something, and is what S1d-05 (V9) needs a real E[C] from.\n\n\
    Implemented 2026-08-07: des.py gained run_policy_crn (N calls to\
    \ run_scenario across scenario_id 0..N-1, same master_seed -> paired),\
    \ measured_window_costs (per-scenario CostLedger.total_cost(min_time=\
    \ warmup_end), no max_time -- S1a-04's own established convention, cited\
    \ in tests/engine/test_costs.py, not invented here), and cvar95 (closed-\
    \ form: mean of the worst 5% of scenario costs). cli.py's `run` (bare\
    \ path, previously `_todo`), `compare`, `gate v3`, and `gate v4` now call\
    \ these instead of np.random/hardcoded arrays; gate v3/v4 gained\
    \ --policy/--scenarios/--master-seed.\n\n\
    Found and fixed a real bug this story's own testing exposed:\
    \ scenarios/generator.py's cache key (master_seed + params content_hash)\
    \ omitted n_scenarios. A cache written for a small n_scenarios request was\
    \ silently reused by a later, larger request under the same master_seed --\
    \ the extra scenario_ids then had no rows in the cached parquet, and\
    \ des.py's _load_daily_sick_calls read that as all-zero sick-call counts\
    \ with no error (confirmed: 17/20 scenarios silently produced zero drafts).\
    \ Nothing before this story ever called generate_scenarios with varying\
    \ n_scenarios under one master_seed, so it never surfaced. Fixed by adding\
    \ n_scenarios to the cache key in both scenarios/generator.py and its\
    \ duplicate in des.py::_scenario_cache_path; confirmed crn.generate_streams'\
    \ own per-scenario streams stay prefix-stable across different n_scenarios\
    \ (numpy SeedSequence.spawn semantics), so the fix doesn't lose that\
    \ property -- covered by two regression tests in test_des_crn.py.\
    \ Also fixed gates/v3_eligibility.py's run_v3_gate returning a bare\
    \ numpy bool for `pass` (np.True_ is True fails identity comparison) --\
    \ same one-line bool() wrap run_v4_gate already had; closed 2 of the 7\
    \ pre-existing test failures. And found tests/test_cli.py::test_cli_compare\
    \ already called the real CLI with --scenarios 100 (unaware it would\
    \ become a real ~4-minute simulation once compare was wired) -- reduced to\
    \ 3 scenarios, keeping the suite fast; the story's own 100-scenario bar is\
    \ the manual check, not an automated one.\n\n\
    Advisor caught a second vacuous mock, inside `run --assert-invariants`:\
    \ sim_fractions there was `np.random.normal(hist[\"mean\"], 0.01, 100)` --\
    \ a Gaussian centred ON the historical mean by construction, so the\
    \ pre-flight V3 check it fed could structurally never fail, same shape as\
    \ S1d-04c's uid-collision-test finding. Fixed: restructured `run` so the\
    \ CRN loop runs once (`sims`) and both --assert-invariants (real\
    \ sim_fractions from sims, same construction as gate v3) and the cost\
    \ aggregation reuse it. Consequence, confirmed by running it: `run\
    \ --assert-invariants` now correctly returns 1 on every real invocation,\
    \ since real simulated eligibility (~0.04) never matches the fabricated\
    \ historical band -- an honest, correct result of wiring real data in,\
    \ not a new bug, and it will stay this way until slice 1c's real\
    \ eligibility reconstruction exists.\n\n\
    Known limitation, not fixed here: BOTH gates' historical sides are\
    \ unreliable, so neither gate v3 nor gate v4 can currently produce a\
    \ trustworthy pass/fail verdict even with real simulated numbers.\
    \ reconstruct_eligibility (V3's historical side,\
    \ data/eligibility_target.py) is entirely fabricated -- np.random.seed(42)\
    \ binomial draws, not a real D1/D2/D3/D4 reconstruction; slice 1c\
    \ (\"Eligibility engine FULL\") is 0/5 done, so this was never built.\
    \ cascade_target (V4's historical side) IS a real D6xD7 reconstruction,\
    \ but returns n_drafts=0 for the holdout window (confirmed directly:\
    \ cascade_target(cfg, 'holdout') -> {'rate': 0.0, 'n_drafts': 0,\
    \ draft_recall.recall: 0.0}) -- a real, pre-existing S0-03 reconstruction\
    \ defect, not something this story's scope covers. Running `gate v3`\
    \ against real simulated data now correctly FAILS (sim ~0.04 vs fake\
    \ historical band [0.29, 0.31]); `gate v4` trivially \"passes\" only\
    \ because both sides degenerate to 0.0 -- not because anything was\
    \ validated. This is the intended outcome of this story (feed the gates\
    \ real data and let a real mismatch surface), not a regression -- S1d-04\
    \ and S1a-12 were marked `done` on the strength of the mocks these gates\
    \ used to read; that basis no longer holds and should be revisited.\n\n\
    Also confirmed (S1d-04c's own finding, restated here since it directly\
    \ explains gate v4's number): n_cascading_drafts is 0 across every scenario\
    \ tried at the R10 policy's 148-crew roster size -- tier-1 (day-off)\
    \ candidates are never exhausted at this scale, so the draft-cascade path\
    \ never fires in practice, even though it is proven correct in isolation."
  check:
    auto: pytest tests/engine/test_des_crn.py
    manual: crewsim compare --policies R6 R10 --scenarios 100
    expect: "paired CRN diff computed from real ledger totals \u2014 the number moves\
      \ when a cost or legality parameter in configs/base.yaml changes"
    fails_if: "the output is unchanged when configs/base.yaml costs are edited \u2014\
      \ that means it is still reading mocked data, not the engine"
