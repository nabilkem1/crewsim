    \ and its own test."
- id: S1e-03
  epic: E1e Reporting
  phase: 1e
  title: Exemplar-scenario drill-down
  size: M
  status: done
  completed: 2026-08-07
  depends_on:
  - S1e-02
  spec:
  - '9.3'
  - '2.3'
  check:
    auto: pytest tests/reporting/test_drilldown.py
    manual: crewsim report --policy R6 --drilldown costliest
    expect: the 5 costliest and 5 most typical scenarios, each an auditable event
      timeline
    fails_if: '''why 6 reserves?'' cannot be answered with a specific simulated Tuesday'
  note: "Implemented 2026-08-07. `crewsim report` gained `--policy` (single\
    \ policy, shorthand for `--policies <one>`) and `--drilldown\
    \ {costliest,typical,both}`, embedding the drill-down section directly\
    \ into the SAME self-contained HTML file `report` already produces\
    \ (S1e-02) -- reachable via an in-page anchor link near the top of the\
    \ page, not a separate file or a buried appendix. `--drilldown`'s value\
    \ is display-only (which group lists first): both the 5 costliest and\
    \ 5 most-typical scenarios are always shown, since that's this story's\
    \ own acceptance bar regardless of which single mode word is passed.\
    \ \"Typical\" = closest to the MEDIAN cost, not the mean -- cost\
    \ distributions here are right-skewed (a few very bad months dominate\
    \ CVaR), so the mean would be pulled toward the tail this drill-down's\
    \ own \"costliest\" half already covers separately.\n\n\
    `gates/drilldown.py` (`select_exemplar_scenarios`, `root_chain`,\
    \ `build_scenario_drilldown`) reuses two REAL, already-existing\
    \ mechanisms rather than inventing new event-timeline logic:\
    \ `Simulation.trace` (S1d-04c's own readable per-scenario event log --\
    \ SICK_CALL -> RESERVE/DRAFT/CANCELLED -> cascade-visible, already\
    \ chronological) for the full auditable timeline, and\
    \ `CostLedger.filter_by_root` (already existed, unused until now) for\
    \ the causal-chain requirement (spec §2.3/C2: \"root_event_uid is\
    \ what lets you attribute a Thursday cancellation back to the Tuesday\
    \ sick call that caused it\"). Each uncovered leg's\
    \ (CANCELLATION/TERMINAL_PENALTY) full chain of ledger rows is matched\
    \ against `sim.trace` by `item {uid}` text so the SAME real narrative\
    \ the engine already produced is shown, not a second, independently-\
    \ reconstructed story that could silently diverge from what actually\
    \ happened. `des.run_policy_crn` gained a `trace: bool = False`\
    \ passthrough (off by default -- real memory cost, wasted for e.g.\
    \ S1e-01's own 500-scenario KPI run which never reads it); when\
    \ `--drilldown`'s policy is also one of `--policies`, the report reuses\
    \ that already-simulated (now traced) batch instead of re-simulating\
    \ it a second time -- measured directly: the naive approach took 13.1s\
    \ for `--policy R6 --drilldown costliest --scenarios 5`, the reused-sims\
    \ version took 7.6s, roughly half, for the common case where the\
    \ drill-down policy is also under comparison.\n\n\
    Real, measured finding: at this corpus/policy scale, every\
    \ uncovered-leg chain found in real 3-10 scenario test runs was a\
    \ single-row chain (SICK_CALL -> CANCELLED directly, no intervening\
    \ RESERVE/DRAFT/cascade step) -- consistent with the already-documented\
    \ near-zero cascade rate (S1d-04e, S1e-01/02's own KPI/report output).\
    \ Multi-step \"sick call -> reserve exhausted -> draft -> cascade ->\
    \ cancellation\" chains are real and supported by the code (verified via\
    \ a synthetic fixture, test_root_chain_matches_ledger_rows_and_trace_lines,\
    \ since real data at this scale doesn't currently exercise the longer\
    \ path) but not what real data currently produces; not forced to look\
    \ richer than it is."
