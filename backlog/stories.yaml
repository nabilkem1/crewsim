- id: S1c-04
  epic: E1c Eligibility
  phase: 1c
  title: "Rule L5 \u2014 one duty-free day per rolling 7"
  size: S
  status: done
  completed: 2026-08-07
  depends_on:
  - S1c-03
  spec:
  - '5.4'
  check:
    auto: pytest tests/engine/test_legality.py -k L5
    manual: crewsim run --policy R6 --scenarios 100 --assert-invariants
    expect: "no scenario introduces or worsens an L5 violation relative to\
      \ the pre-simulation baseline (delta, not raw count -- see note)"
    fails_if: "the drafting/reserve-assignment path introduces or worsens\
      \ any L5 violation vs. that baseline"
  note: "check_l5_duty_free_day and its unit tests were already correct in\
    \ isolation -- the gap was, again, the manual-check CLI path:\
    \ `run --assert-invariants` only ever checked the V3 eligibility gate,\
    \ never L5 at all, despite the story's own manual check naming it\
    \ explicitly.\n\n\
    Added `find_l5_streak_spans(crew)` (legality.py, plus a\
    \ LegalityResult-wrapped `find_l5_calendar_violations` for reporting):\
    \ scans a crew's ENTIRE realized calendar (not one candidate\
    \ assignment against a sliding window, as check_l5_duty_free_day does\
    \ per-assignment) for every >144h work streak without a 24h break --\
    \ this is what `--assert-invariants` now runs, over every crew\
    \ (roster + reserves) in every scenario.\n\n\
    First attempt (raw post-sim count) surfaced something bigger: the real\
    \ STATIC roster (before any simulation) has L5 \"violations\" across\
    \ 465/1975 active crew (23.5%) -- real multi-day trips whose duty\
    \ periods are separated by under 24h, so no rolling 7-day window ever\
    \ contains one full clear day. Verified via spec \u00a75.4 this is NOT a\
    \ corpus bug: L5 is explicitly a deliberately conservative surrogate\
    \ (\"surrogate-legal \u21d2 almost always truly legal\", allowed to\
    \ over-reject vs. the real agreement). Discussed with the user, who\
    \ chose: (1) a DELTA-based invariant -- compare each scenario's\
    \ post-sim crew calendars against the pre-simulation baseline, fail\
    \ only on NEW or WORSENED violations -- over a raw count (which would\
    \ always fail regardless of engine behavior, permanently unable to\
    \ distinguish a real regression from baseline noise); (2) track the\
    \ corpus/rule finding as its own story, S1c-04b, rather than leave it\
    \ as a buried note.\n\n\
    Two more real bugs found and fixed while building the delta check,\
    \ both against real corpus data, not just theoretical:\n\
    1. `find_l5_streak_spans`'s own first draft appended a span on EVERY\
    \ merged block still inside an already-over-144h streak, not once per\
    \ streak -- a single 9-block continuous streak for one real crew\
    \ (P00360) produced 9 near-duplicate spans (same start, progressively\
    \ larger end), inflating the corrected corpus-wide baseline count from\
    \ an initially-reported 2,716 down to the real 713 once fixed (the\
    \ 465-crew / 23.5% figure was unaffected -- that counted crew, not\
    \ instances). Fixed to emit exactly one span per maximal streak, only\
    \ when it actually ends. Regression test:\
    \ test_find_l5_streak_spans_one_entry_per_streak.\n\
    2. The delta comparison itself, once span-based, still used exact\
    \ tuple equality -- and a sick call removing a block from the middle\
    \ of a baseline-violating streak shrinks its span (an improvement),\
    \ producing a different tuple that exact matching wrongly flagged as\
    \ \"new\" (found against real data: crew P00381's baseline span\
    \ (-254, 11877) became (-254, 10001) post-sim after a sick call\
    \ removed one block -- a real improvement, wrongly flagged). Fixed\
    \ with `find_l5_regressions(baseline_spans, post_spans)`: a post-sim\
    \ streak is only a regression if it is NOT contained within (starts no\
    \ earlier, ends no later than) some baseline streak for that crew.\
    \ Extracted as its own testable function (not an inline CLI closure)\
    \ specifically so the delta logic has unit coverage independent of\
    \ real corpus data, including a case proving it CAN fail\
    \ (test_find_l5_regressions).\n\n\
    A third, real bug found and fixed in check_l5_duty_free_day itself\
    \ (the per-assignment check, used on the live reserve/draft path via\
    \ is_legal_assignment): it scanned its full +/-7d padding window for\
    \ ANY over-length streak and rejected the candidate duty if one\
    \ existed anywhere in that window -- even a streak the candidate duty\
    \ was completely unrelated to and well-separated from (>24h gap).\
    \ Proved with a synthetic case: a candidate duty 4+ days from an old\
    \ unrelated 150h streak was wrongly rejected, blamed on that streak.\
    \ Fixed to only reject when the candidate duty actually overlaps the\
    \ offending streak. Measured impact directly, not assumed: bypassing\
    \ L5 entirely (diagnostic monkeypatch) made ZERO measurable difference\
    \ to eligibility (0.0317 with and without), ruling this out as a\
    \ contributor to the unrelated, already-documented 0.03-vs-0.30 V3 gate\
    \ gap; and `explain-recovery --scenario 0 --policy R10` before/after\
    \ this fix produced IDENTICAL output (191 drafts, $5,162,800 total,\
    \ same category breakdown) -- zero measurable draft-path impact on\
    \ this reference scenario either. Fixed anyway since it's a real\
    \ correctness bug on the draft path, in scope for a story literally\
    \ about L5. Regression test:\
    \ test_l5_ignores_unrelated_preexisting_streak.\n\n\
    Final verified state (post all three fixes): drafting/reserve-\
    \ assignment introduces zero new L5 violations and worsens none.\
    \ `--assert-invariants` reports PASS on its L5 section for real; its\
    \ baseline is scoped to the run's own policy/base/fleet/position\
    \ (R6 in the story's own manual check: 126 streaks across 80 crew --\
    \ a SUBSET of the 713-streak/465-crew whole-corpus figure discussed\
    \ above and on S1c-04b's card, not a contradiction of it).\n\n\
    mypy --strict: find_l5_streak_spans, find_l5_calendar_violations, and\
    \ find_l5_regressions are all clean; the other 5 pre-existing gaps in\
    \ legality.py (untyped cfg=None parameters, predating this story) are\
    \ unchanged, out of scope."
