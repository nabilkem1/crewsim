    \ gates/v3_eligibility.py::write_v3_report) with: cost distributions per\
    \ policy, a reserve-level trade-off curve (E[C] and CVaR95 vs R, real\
    \ argmin marked), a lambda curve (the real objective from spec \u00a77.4,\
    \ per R, plus the resulting R* -- reusing S1d-05's\
    \ `_real_r_recommender` on data already simulated for the trade-off\
    \ curve rather than re-simulating via `build_r_star_lookup`), the\
    \ reproducibility chain, a gate-status table, and every outstanding\
    \ `[CONFIRM: owner]` marker found by scanning the RAW text of\
    \ configs/base.yaml and costs_pilots.yaml (these are YAML comments,\
    \ invisible to the parsed config object). Verified self-contained by\
    \ grepping the output for actual `<script src=` / `<link href=` tags\
    \ (zero) -- not a naive substring search for \"http\", which also\
    \ matches literal attribution-link strings baked into the bundled\
    \ plotly.js library itself (unused map-tile copyright text), a false\
    \ positive gate_v3_holdout.html already has too.\n\n\
    Real, measured findings surfaced by actually building this: E[cost] is\
    \ close to flat across R4..R14 (~1-2% spread) at this corpus/policy\
    \ scale -- CVaR95 is where the real U-shape lives (matches S1d-05's own\
    \ corrected finding). The report says this explicitly on the page\
    \ (captioned, not silently marking a meaningless E[cost] optimum) rather\
    \ than forcing the \"U-shaped curve\" language from the story's own\
    \ `expect` onto data that doesn't show it for E[cost].\n\n\
    Gate status is honest, not uniformly green: V1/V2 are rendered as\
    \ `STUB` (their pre-existing cli.py implementations are hardcoded PASS\
    \ text / a stubbed mock value, not derived from any real run) --\
    \ printing them as PASS in a report whose entire premise is spec\
    \ \u00a79.3's \"no black box\" rule would itself be a black box. V3/V4/V9\
    \ report real verdicts against a stated representative policy (first\
    \ of --policies, named explicitly on the page). Found and fixed a real,\
    \ separate bug while wiring V7 into this table: `gate v7`'s CLI\
