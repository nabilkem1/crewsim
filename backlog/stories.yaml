- id: S0-00
  epic: E0.0 Project foundation
  phase: '0'
  title: Create the Python project structure
  size: M
  status: done
  completed: 2026-08-05
  depends_on: []
  spec:
  - '4.2'
  check:
    auto: pytest tests/test_project_structure.py
    manual: 'PYTHONPATH=src python -m crewsim doctor   # or `crewsim doctor` after
      `uv sync`'
    expect: "every \xA74.2 module present; corpus_dir resolves to src/crewsim/data/corpus\
      \ with 12 datasets found"
