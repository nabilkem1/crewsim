- id: S0-09b
  epic: E0 Data foundation
  phase: '0'
  title: "Fix the gate CLI's fitting-window guard so S0-09's own test file passes"
  size: S
  status: done
  completed: 2026-08-07
  depends_on:
  - S0-09
  spec:
  - '6.4'
  - '9.2'
  note: "Backlog-integrity fix, 2026-08-07: 2 of S0-09's own 3 auto-check tests\
    \ (test_gate_refuses_fitting_without_flag, test_gate_allows_fitting_with_flag)\
    \ were failing on main -- discovered while explaining the full suite's 3\
    \ pre-existing failures to the user. Root cause: `gate_id` was a required\
    \ positional argument on the `gate` subcommand, so `crewsim gate --window\
    \ fitting` (what both tests call, with no gate_id) died at argparse time\
    \ with exit 2 before the window guard at line 711 ever ran. Separately,\
    \ the fallback branch for an unmatched gate_id referenced `getattr(args,\
    \ 'gate_name', 'unknown')` -- an attribute nothing in cli.py ever sets --\
    \ so it always printed \"Gate unknown validation passed checks.\" and\
    \ returned 0, silently treating a typo'd gate_id (e.g. `gate v99`) as\
    \ success. Fixed: `gate_id` is now `nargs=\"?\", default=None`. When\
    \ omitted, the window guard runs and (if it passes) prints a message\
    \ containing \"Gate validation passed\" and returns 0 -- a guard-only\
    \ invocation, matching what this story's own test file actually checks.\
    \ When gate_id is present but doesn't match v1/v2/v3/v4/v7, it now prints\
    \ an explicit \"unknown gate_id\" error, shows help, and returns 2\
    \ (matching the `config` subcommand's own convention two blocks above),\
    \ instead of the old silent-success fallback. Verified: both target tests\
    \ pass, `gate v1` and `gate v4` (a real matched id) still dispatch\
    \ correctly, `gate v99` now correctly exits 2, full suite green (220\
    \ passed, up from 217)."
  check:
    auto: pytest tests/calibration/test_holdout.py
    manual: crewsim gate --window fitting; crewsim gate --window fitting --i-know;
      crewsim gate v99
    expect: 'first refuses (exit 1, "Use --i-know"); second passes the guard and
      prints "Gate validation passed" (exit 0); third prints "unknown gate_id" and
      exits 2'
    fails_if: an unrecognized gate_id silently exits 0
