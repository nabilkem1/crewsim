- id: S1e-01
  epic: E1e Reporting
  phase: 1e
  title: KPI aggregation over the measurement window
  size: M
  status: done
  completed: 2026-08-07
  depends_on:
  - S1d-05
  spec:
  - '2.1'
  - 5.0.5
  check:
    auto: pytest tests/reporting/test_kpis.py
    manual: crewsim run --policy R6 --scenarios 500 --kpis
    expect: "E[C], CVaR95, uncovered, eligibility, cascade rate, draft distribution\
      \ \u2014 warm-up excluded"
    fails_if: warm-up rows are included, or cool-down costs are not attributed back
      to the window
  note: "Implemented 2026-08-07. Found and fixed a significant pre-existing\
    \ bug in `des.measured_window_costs` (S1d-04d) while building this --\
    \ squarely in scope, since this story's own acceptance criterion IS the\
    \ attribution rule ('cool-down costs attributed back when their cause\
    \ is in-window'). The old implementation (`min_time=warmup_end, no\
    \ max_time`) treated EVERY cool-down-booked ledger row as in-window,\
    \ including ones whose root event is a brand-new sick call that itself\
    \ arrived during cool-down (`_load_daily_sick_calls` generates arrivals\
    \ across the FULL `horizon_days`, cool-down included -- a known,\
    \ separate S1d-04c limitation, not fixed here). Measured directly\
    \ before fixing: 15-33% of the old per-scenario cost figure, across 5\
    \ real R6 scenarios, was cool-down-originated cost that should never\
    \ have counted.\n\n\
    Fixed with a real root_event_uid-based attribution rule\
    \ (`des.rows_in_measurement_window`, refactored out of\
    \ `measured_window_costs` so both cost totals and the new KPI counts\
    \ share one definition of \"in the measurement window\"): a row counts\
    \ if booked inside the window, OR booked in cool-down with its causal\
    \ chain's origin (earliest sim_time among all rows sharing its\
    \ root_event_uid) inside the window. Verified the root_event_uid==0\
    \ sentinel (background costs with no causal chain at all, e.g.\
    \ RESERVE_STAFFING) is NOT treated as one shared chain across unrelated\
    \ rows -- each uses its own booking time. Verified against real data\
    \ (not assumed) that no chain currently straddles window-origin ->\
    \ cool-down-booking in this corpus (the \"pull back in\" branch is real\
    \ per spec but currently empirically unexercised by real data --\
    \ covered instead by a synthetic regression test,\
    \ test_measured_window_costs_cooldown_attribution).\n\n\
    Downstream impact, re-verified directly (S1d-05 is the only consumer of\
    \ `measured_window_costs` besides `run`/`compare`): the V9 sweep's own\
    \ finding CHANGED after this fix, and S1d-05's card has been corrected\
    \ -- see its own note. `explain-eligibility`'s window filtering also\
    \ needed the same treatment: `EligibilityEngine.get_distribution()`\
    \ gained optional `min_time`/`max_time` params (backward compatible --\
    \ no-args call, which V3's gate already depends on, is unchanged).\
    \ Cascade rate is NOT window-filtered (`sim.n_cascading_drafts`/\
    \ `n_drafts` are whole-simulation counters with no root_event_uid to\
    \ attribute back with), matching gate V4's own existing convention.\n\n\
    Gini's \"arithmetic, not insight\" caveat (spec's glossary and Sec9\
    \ language) is printed unconditionally alongside every Gini value, not\
    \ gated behind an invented numeric rarity threshold -- the spec gives\
    \ no such threshold, and its own language (\"a concentration measure...\
    \ here it describes premium earnings\") reads as a standing caveat, not\
    \ a conditional warning."
- id: S1e-02
  epic: E1e Reporting
