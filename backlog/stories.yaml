- id: S1d-05
  epic: E1d Cascades
  phase: 1d
  title: "V9 sensitivity sweep \u2014 terminal penalty, roster_size, lambda"
  size: M
  status: done
  completed: 2026-08-07
  depends_on:
  - S1d-04d
  spec:
  - '9.2'
  - '7.4'
  gate: V9
  check:
    auto: pytest tests/gates/test_v9_sensitivity.py
    manual: crewsim gate v9 --scenarios 20 --surface
    expect: recommended R as a surface over the swept parameters, not a point
    fails_if: R* moves a lot and the report does not say so prominently
  note: "Unblocked and implemented 2026-08-07. The stated blocker\
    \ (\"no code defines how lambda_risk_dial blends E[cost] and CVaR95\")\
    \ turned out to be answered by the spec itself, not something to invent:\
    \ \u00a77.4 gives the objective verbatim --\
    \ `stage1_cost(R) + Q.mean() + lam * cvar95` -- and\
    \ `des.run_policy_crn`/`measured_window_costs`/`cvar95` (S1d-04d) are\
    \ exactly the real inputs it needs. Confirmed directly (not assumed)\
    \ that `measured_window_costs` already includes stage-1 reserve\
    \ staffing cost (RESERVE_STAFFING is booked inside the simulation,\
    \ des.py:180, and scales with R: $21.7K/scenario at R4 vs $59.4K at\
    \ R10) -- so the real objective in this codebase is simply\
    \ `mean_cost + lam * cvar95`, no separate C1(R) term, and adding one\
    \ would have double-counted.\n\n\
    Implemented `build_r_star_lookup(cfg, costs, n_scenarios, master_seed,\
    \ policies, terminal_penalties)` (gates/v9_sensitivity.py): runs the\
    \ REAL CRN pipeline for each of 5 real candidate reserve policies\
    \ (R4/R6/R8/R10/R14 -- these already existed as real policy files and\
    \ match spec \u00a77.4's own worked-example table exactly) x each\
    \ terminal_penalty value, producing real (mean, CVaR95) pairs. Varying\
    \ terminal_penalty for real required overriding a frozen pydantic\
    \ model (`costs.disruption.model_copy(update=...)`, since\
    \ `DisruptionCosts` is `frozen=True`) -- verified the override actually\
    \ takes effect, not a silent no-op. `_real_r_recommender(r_lookup)`\
    \ returns a `mock_r_function`-shaped closure that argmins the real\
    \ objective over the real simulated candidates for a given\
    \ (terminal_penalty, lambda) -- `run_v9_gate` keeps its existing\
    \ `mock_r_function` injection seam unchanged (both pre-existing tests\
    \ still pass verbatim), and now also accepts `r_lookup` for the real\
    \ path; calling with neither raises instead of silently falling back to\
    \ the old `default_mock_r` \"completely hypothetical relationship for\
    \ demonstration\" formula, which has been deleted.\n\n\
    Two real findings from actually running this, not assumed: (1)\
    \ `TERMINAL_PENALTY` never fires across 50 real simulation runs (5\
    \ policies x 10 scenarios) at this corpus/roster scale -- every open\
    \ item resolves before the horizon ends, so the terminal_penalty axis\
    \ is real and correctly wired but currently empirically inert, the\
    \ same character as the pre-existing roster_size finding below.\n\n\
    CORRECTED 2026-08-07 (S1e-01): finding (2) above, as originally\
    \ written, said R* was flat at 4 across every lambda, unlike spec\
    \ \u00a77.4's own illustrative worked example (which flips 6->10 as lambda\
    \ goes 0->1). That flatness turned out to be an ARTIFACT of a real bug\
    \ in `des.measured_window_costs` found and fixed while implementing\
    \ S1e-01 (its own note has the full detail): the old cost-attribution\
    \ rule wrongly counted 15-33% of every scenario's cost as cool-down\
    \ activity that never should have been in-window. Re-ran the identical\
    \ real 5-R x 20-scenario sweep (`build_r_star_lookup`,\
    \ `terminal_penalties=[1.5]`) after the fix: R* now genuinely FLIPS from\
    \ 4 (lambda=0.0) to 10 (lambda>=0.25) -- qualitatively matching spec\
    \ \u00a77.4's own worked-example pattern (risk-neutral picks low R,\
    \ risk-averse picks higher R), which the pre-fix numbers did not. The\
    \ V9 mechanism itself (real R sweep, real terminal_penalty override,\
    \ real lambda blend) was correct all along; only the upstream cost\
    \ figure it consumed was wrong. Re-verified, not assumed -- same\
    \ discipline as S1c-04's 2,716->713 correction.\n\n\
    roster_size scope, discussed with the user 2026-08-07: this story's own\
    \ acceptance criterion names three sweep axes (roster_size,\
    \ terminal_penalty, lambda); only two are real. `cfg.population.roster_size`\
    \ has exactly one consumer in the entire codebase -- a print statement\
    \ in `config show` -- confirmed by grep, not inferred. The real roster\
    \ is always the fixed 112-crew mock corpus regardless of this value, so\
    \ sweeping it would change nothing (matching this card's own\
    \ pre-existing \"Known baseline\" finding below, from before headcount\
    \ conservation). Making it real needs the mock corpus generator to\
    \ emit multiple population sizes -- materially bigger, out of this\
    \ story's scope, and not invented here. The CLI now prints an explicit\
    \ NOTICE saying so on every real `gate v9` run rather than silently\
    \ reporting a flat, meaningless roster_size axis.\n\n\
    `gate v9` (CLI) was previously entirely unwired -- `args.gate_id ==\
    \ \"v9\"` had no dispatch branch at all, so it fell through to the\
    \ unknown-gate_id error. Added it: builds the real r_lookup via\
    \ `build_r_star_lookup`, prints the real simulation-count/roster_size\
    \ notices, then `run_v9_gate`/`print_v9_report`. At the default\
    \ `--scenarios 20`, `gate v9` runs 5 policies x 4 valid terminal_penalty\
    \ values x 20 scenarios = 400 real simulations (~7 minutes) -- far past\
    \ other gates' <=60s manual-check convention, an inherent cost of a\
    \ real 2-axis sweep, not something to fake down. `--scenarios 3` (used\
    \ for this story's own local verification) still ran end-to-end and\
    \ correctly reported [STABLE], R*=4."
