meta:
  project: crew-recovery-sim
  spec: spec_sections/ v3.1
  updated: 2026-08-05
phases:
  '0':
    name: Project foundation & data
    folder: mvp
    gate: draft reconstruction >= 80% recall
  1a:
    name: Ledger, CRN & legality core
    folder: mvp
    gate: V1 degeneracy, V7 reproducibility, V8 L0 invariant
  1b:
    name: Real rosters & full event set
    folder: mvp
    gate: V2 Erlang-B bound
  1c:
    name: Eligibility engine FULL
    folder: mvp
    gate: V3 on holdout
  1d:
    name: Cascade engine FULL
    folder: mvp
    gate: V4 on holdout, V9 sensitivity
  1e:
    name: Reporting & backtest
    folder: mvp
    gate: V5 SME sign-off, V6 cost backtest
  '2':
    name: Optimisation & scale
    folder: product_1
    gate: recommendation stable under search
  '3':
    name: Enterprise hardening
    folder: product_1
    gate: formal V&V accreditation
