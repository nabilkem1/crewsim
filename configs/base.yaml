# =============================================================================
# configs/base.yaml — MVP scope & horizon
#
# This file is the ONLY place these values are set. Nothing in src/ or in
# crewsim_skeleton.py may hard-code them (§4.4, parameter registry).
#
# Marker convention:
#   [CONFIRM: <owner>]  a placeholder. Plausible in magnitude, NOT an Air
#                       Transat figure. Must be replaced before any result
#                       informs a bid-period decision.
# =============================================================================

paths:
  # The corpus the loaders read. It ships INSIDE the package, alongside the
  # loaders in src/crewsim/data/, so a checkout is runnable with no generation
  # step. Nothing may hard-code this path -- same rule as every other value
  # (§4.4): pointing at Air Transat's real extracts is a one-line change here.
  corpus_dir:    src/crewsim/data/corpus
  # Run output. Created on first write, git-ignored, absent from a checkout.
  params_dir:    output/params           # calibration output (§6.2 parameter store)
  reports_dir:   output/reports          # HTML reports (§9.3)
  seasons_file:  configs/seasons.yaml    # season -> months (§4.5.2), one source of truth

windows:
  # Fitting/holdout split (§6.4). [CONFIRM: Crew Planning / Data Science] — the
  # exact boundary is a business decision this file records, not one the code
  # should invent. Illustrative in the spec itself (00_Intro glossary: "Fit on
  # 2023-2025, then check ... against 2025-2026, which the fit never saw").
  # These dates match the mock corpus's actual span (2023-08-01 .. 2026-07-31)
  # exactly, so there is no partial-year edge; a real data window will differ.
  # S0-02b is the first story to need a window to slice by; S0-09 is the one
  # that turns this into a hard refusal.
  fitting: {start: 2023-08-01, end: 2025-07-31}   # 24 months
  holdout: {start: 2025-08-01, end: 2026-07-31}   # 12 months

scope:
  base:       YUL            # Montréal–Trudeau
  fleet:      A321neoLR      # no type-rating overlap with A330 (§4.5.1)
  position:   FO
  crew_group: pilots         # ALPA. Cabin crew (CUPE) is Phase 2, own cost file.
  season:     winter_sun     # one season per run (§4.5.2)
  bid_period: 2027-01        # the specific bid period being modelled

horizon:
  warmup_days:      7        # simulated, excluded from KPIs
  measurement_days: 28       # one bid period — KPIs computed here
  cooldown_days:    7        # lets late cascades realise their cost
  # total = 42 days (§5.0.5)

population:
  # Total crew in scope = line holders + reserves.
  # Reserves are carved OUT of this number (§5.10), never added to it.
  # Ask Crew Planning for the PUBLISHED LINE COUNT for the bid period above,
  # including how many of those lines were reserve lines — that single figure
  # answers the total-vs-line-holder question and gives the historical R to
  # compare recommendations against (§1.5).
  roster_size: 120           # [CONFIRM: Crew Planning]

demand:
  # roster_size is meaningless on its own: it is only meaningful against how
  # much flying that population covers. Supply one of these for the same scope
  # and bid period; the other is derived.
  #
  # NOTE: declared here but NOT yet consumed. Flying is generated exogenously
  # until slice 1b, when sick calls bind to real roster crew and pairings come
  # from dataset D3. The loader warns if this is set while unconsumed.
  pairings_per_bid_period: 480         # [CONFIRM: Crew Planning]
  # credit_hours_per_bid_period: 9600  # alternative to the line above
  uncovered_deadline_hours: 0.0

sensitivity:
  # Swept by gate V9 (§9.2). If the recommended reserve level is stable across
  # a range, the imprecision in that parameter does not block the next slice.
  roster_size:      [100, 120, 140]
  terminal_penalty: [1.0, 1.25, 1.5, 2.0, 3.0]   # × cancel_cost
  lambda_risk_dial: [0.0, 0.25, 0.5, 0.75, 1.0]
  instability_threshold: 2   # R* swing (units) across a swept parameter that counts as "unstable" (S1d-05)

mode: FULL                   # REDUCED is for smoke tests only — never a recommendation
costs_file: costs_pilots.yaml

# =============================================================================
# The two sections below (S1a-02) absorb numeric literals that pre-dated the
# "no numeric constant outside configs/" rule (§4.4) -- they were written
# in-line in quality.py/delays.py/regime.py/profile.py during Phase 0
# (S0-02/S0-06/S0-07/S0-07b), before this file's own rule existed to catch
# them. Moved here verbatim, no value changed. Two, `d4_link_marginal` and
# `d9_completeness_pass`, have no citation anywhere in the spec -- they were
# an implementation judgment call, not a business or spec-mandated figure.
# Flagged rather than silently re-homed as if confirmed.
# =============================================================================
quality_gates:                       # §6.2 data quality gates
  d4_link_pass:        0.95          # §6.2 "The Sick Call Link Test"
  d4_link_marginal:     0.90         # [CONFIRM: Data Science] -- not spec-cited
  d6_d7_join_pass:      0.80         # §6.2 "The Payroll Link Test"
  d9_completeness_pass: 0.98         # [CONFIRM: Data Science] -- not spec-cited

calibration:                         # S0-06/S0-07/S0-07b fitting choices
  delay_gmm_components:   2          # short-delay / long-delay mixture (S0-07b)
  delay_gmm_random_state: 42         # NOTE: a literal seed, not a CRN/stable_seed()
                                      # stream (§4.3) -- this is an offline sklearn
                                      # fit at calibration time, not scenario RNG.
                                      # Flagged as tech debt, not fixed, by S1a-02.
  regime_quantiles:                  # chaos-count cut points -> CALM/NORMAL/DISRUPTED/SEVERE
    p_calm:      0.5
    p_normal:    0.8
    p_disrupted: 0.95
  overdispersion_threshold: 1.5      # var/mean bar for "clearly overdispersed" (§5.2)
  sick_call_min_duration_days: 0.5   # S1d-04c: floor on the S0-07 lognormal draw --
                                      # its support runs down near 0, and a sick call
                                      # shorter than this isn't a distinct modelled case.

draft_reconstruction:                 # S0-03, §6.3-1 -- the D6 x D7 join, spelled out as data
  # No `was_drafted` column exists anywhere in Air Transat's systems (§6.3-1):
  # a draft is the join of "D6 schedule change looks urgent" and "D7 payroll
  # actually paid a premium for it". Every part of that recipe is a
  # parameter, not a hard-coded assumption about how Air Transat's systems
  # happen to be coded today.
  premium_pay_codes:        [DRAFT_PREM]          # D7 pay_code values that count as a draft premium
  short_notice_reason_codes: [SHORT_NOTICE_COVER]  # D6 reason_code values that count as "urgent"
  initiator_filter:          [IOC]                 # D6 initiator values accepted -- a NULL initiator
                                                    # always passes regardless of this list (older
                                                    # records; must not be silently dropped, §6.3-1)

cascade_reconstruction:               # S0-05, §6.3-3 -- the 7-day follow-on scan
  window_days: 7                      # spec §6.3-3: "scan that exact pilot's schedule for the next 7 days"
  cascade_reason_codes: [CASCADE_UNCOVERED]   # D6 reason_code values that count as "a flight broke"
  confidence_level: 0.95              # for the reported rate's CI -- a reporting choice, not a formula constant

legality:                             # Rules configuration
  # S1a-07 L1/L2. These were literals in four separate modules (legality.py,
  # drafting.py, cascade.py, des.py), each independently re-deriving the same
  # CBA figure -- so a rest-rule change was a four-file edit with no guarantee
  # they stayed in step. S1a-02's own acceptance criterion names L2 rest as the
  # example of a value that must be a configurable knob; now it is one.
  max_duty_hours:        13.0         # [CONFIRM: Crew Planning] S1a-07 L1 max duty period
  min_rest_hours_home:   11.0         # [CONFIRM: Crew Planning] S1a-07 L2 min rest at home base
  min_rest_hours_away:   10.0         # [CONFIRM: Crew Planning] S1a-07 L2 min rest away from base
  short_call_notice_hours: 2.0        # [CONFIRM: Crew Planning] S1c-02 L8 short call limit
  long_call_notice_hours: 12.0        # [CONFIRM: Crew Planning] S1c-02 L8 long call limit
  rolling_7d_duty_limit_hours: 60.0   # [CONFIRM: Crew Planning] S1c-03 L3 duty limit
  rolling_7d_flight_limit_hours: 35.0 # [CONFIRM: Crew Planning] S1c-03 L3 flight limit
  rolling_28d_duty_limit_hours: 190.0 # [CONFIRM: Crew Planning] S1c-03 L4 duty limit

cascade:
  visibility_lag_hours: 24.0        # [CONFIRM: Crew Planning] S1d-01 Cascade visibility lag

