# =============================================================================
# Cost coefficients — pilots (ALPA agreement). All CAD. Spec §4.4.2.
#
# EVERY VALUE HERE IS [CONFIRM: Finance + Crew Planning].
# They are placeholders chosen to be the right order of magnitude so that the
# worked examples in the spec are arithmetically checkable. None is an Air
# Transat figure. §9.3 requires any report whose result depends on one of these
# to list it as outstanding.
# =============================================================================
version: v0.1.0-placeholder

reserve:
  guarantee_per_day:                     # kappa — paid whether used or not
    short_call: 250                      # [CONFIRM: Finance]
    long_call:  180                      # [CONFIRM: Finance]
  utilisation: 150                       # q_res — marginal delta when actually used

draft:
  base_premium: 500                      # q_base — paid on every draft
  tier:                                  # q_tier — by what the crew member was doing
    1: 0                                 # day off (WFY)
    2: 300                               # holds a conflicting pairing
    3: 900                               # ground training
    4: 2500                              # vacation   <- newly high priority, see below
    5: 4000                              # simulator slot
  train_reschedule: 1200                 # added on a tier-3 or tier-5 draft

# Tier 4 note: Air Transat has no protected-block rule, so vacation is REACHABLE
# rather than forbidden — and senior-first drafting reaches the crew holding the
# best vacation. This moved from a corner case to a live cost driver (§4.4.2).

positioning:                             # §4.4.2 q^pos
  deadhead: 400
  hotel:    220
  # S1c-07 follow-up. §5.8 names TRANSPORT (ground transport between airport and
  # hotel) as a positioning ledger category, but §4.4.2 priced only the two
  # figures above, so the engine had a category it could never book. Added on
  # the user's instruction 2026-08-09 with the value to be confirmed by Finance.
  #
  # PROVENANCE, so nobody mistakes this for a negotiated rate: 402.54 is the
  # arithmetic mean of D10's 245 real TRANSPORT invoices. It is NOT of the same
  # kind as the two values above -- those are Finance planning rates and do not
  # track D10 at all (hotel is 220 against a D10 mean of 388; deadhead is 400
  # against 370). There is no consistent ratio to extrapolate from, so an
  # invoice mean is the only defensible placeholder, and the non-round figure is
  # deliberate: it should read as provisional.
  transport: 402.54                      # [CONFIRM: Finance] — see above

disruption:
  cancellation:       25000              # internal cost of cancelling one flight
  delay_per_minute:   55
  terminal_penalty_multiple: 1.5         # x cancellation; MUST exceed 1.0 (§5.0.5)

# Statutory passenger compensation, Canadian APPR, large carrier.
# [CONFIRM: Legal — verify against the current CTA schedule]
appr_compensation:
  # S1b-06 AC2: which band a CANCELLATION attracts. Passenger re-accommodation
  # is not modelled, so the delay a cancelled flight actually causes is unknown;
  # this names the assumption instead of burying it in code. hours_9_plus is the
  # conservative choice (same bias convention as the legality rules) -- a
  # cancelled flight with no modelled rebooking is not a short delay.
  cancellation_band: hours_9_plus       # [CONFIRM: Legal] hours_3_to_6 | hours_6_to_9 | hours_9_plus
  hours_3_to_6:  400
  hours_6_to_9:  700
  hours_9_plus:  1000
