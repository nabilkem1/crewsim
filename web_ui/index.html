<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>web_ui</title>
    <script>
      // Stamp the theme BEFORE any CSS paints or React mounts, so switching
      // between Light and the "Ops Console" dark theme doesn't flash the wrong theme for a
      // frame on load. Kept in sync with App.tsx's THEME_STORAGE_KEY.
      (function () {
        try {
          var stored = localStorage.getItem('crewsim.theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light');
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
