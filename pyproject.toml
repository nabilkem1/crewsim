[project]
name = "crewsim"
version = "0.1.0"
description = "Crew reserve & drafting policy optimisation for Air Transat"
requires-python = ">=3.11"
dependencies = [
    "simpy>=4.1",
    "numpy>=1.26",
    "polars>=0.20",
    "pydantic>=2.5",
    "pyyaml>=6",
    "joblib>=1.3",   # parallel scenario evaluation, MVP (spec Sec 4.1) -- runtime, not dev-only
    "plotly>=5.20",  # self-contained HTML reports, MVP (spec Sec 4.1)
    "statsmodels>=0.14.6",
    "scipy>=1.17.1",
    "pyarrow>=25.0.0",
    "scikit-learn>=1.9.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.30",
]

[project.scripts]
crewsim = "crewsim.cli:main"

[dependency-groups]
# uv-native dev group (PEP 735): `uv run`/`uv sync` install this by default,
# with no `--extra dev` needed on every invocation. A PEP 621
# optional-dependencies extra does NOT get this treatment -- uv only installs
# it when explicitly requested, and prunes it back out on a bare `uv run`
# otherwise. That mismatch was the actual cause of pytest/ruff/mypy
# disappearing from .venv after S0-01: `uv sync --extra dev` installed them,
# then a later plain `uv run mypy ...` re-synced to the base project and
# silently removed them.
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff",
    "mypy",
    "types-PyYAML",
    "scipy-stubs>=1.17.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The whole package directory ships, non-Python files included — that is what
# carries src/crewsim/data/corpus/ (the D1–D12 datasets) into the wheel.
packages = ["src/crewsim"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# src/crewsim/api/ used to be excluded here while the web-API workstream was in
# flight, mirrored by EXCLUDED_TREES in tests/workstreams.py. Both are gone: the
# carve-out was what let a 500-ing health endpoint, a naive/aware datetime bug
# (the very thing DTZ below is enabled to catch) and several fabricated-data
# routers land unreviewed. The whole package is linted now.

[tool.ruff.lint]
# Pinned EXPLICITLY rather than inheriting ruff's default selection. Left
# implicit, a ruff upgrade silently changes what CI enforces -- which is how a
# lint config becomes untrustworthy: it either starts failing on unrelated
# upgrades or quietly stops checking something. This is the set the tree was
# cleaned against.
select = [
    "F",      # pyflakes: real errors (undefined names, unused imports/vars)
    "E4", "E7", "E9",  # pycodestyle: imports, statements, syntax
    "I",      # import sorting
    "UP",     # pyupgrade: keep to the 3.11 baseline in pyproject
    "B",      # bugbear
    "C4",     # comprehensions
    "SIM",    # simplify
    "RUF",    # ruff-specific
    "BLE",    # blind except -- deliberate ones carry a noqa with a reason
    "DTZ",    # naive datetimes: this project is strict about them (see roster_loader)
    "ISC",    # implicit string concat
    "PIE",
    "PLR", "PLW",  # pylint refactor/warning subsets
]
ignore = [
    # Long-ish boolean/branch counts are normal in the legality and CLI
    # dispatch layers; splitting them for a metric would hurt readability.
    "PLR0911", "PLR0912", "PLR0913", "PLR0915",
    # Magic-value comparison: this project already enforces the far stricter
    # "no numeric constant outside configs/" rule in tests/test_config.py,
    # which is AST-based and has an audited allowlist. PLR2004 would duplicate
    # it with worse signal.
    "PLR2004",
    # legality.py's rule chain is 19 lines of `if not rN.legal: return rN`.
    # That compact one-per-rule shape is the file's deliberate style and reads
    # better than 38 lines; E701 would only churn it.
    "E701",
    # Engine functions genuinely take many positional parameters (crew, item,
    # cfg, now, costs...). Capping the count would push them into ad-hoc
    # parameter objects for a metric, not for clarity.
    "PLR0917",
]

[tool.ruff.lint.flake8-bugbear]
# `db: Session = Depends(get_db)` is FastAPI's dependency-injection syntax, not
# a mutable default argument: the framework evaluates it per request. B008 flags
# every route that touches the database otherwise. This is the setting ruff
# documents for exactly this case -- it does not disable B008, it teaches it
# which calls are safe in a default.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

[tool.mypy]
python_version = "3.11"
# Strict on the engine only (§4.3): that is where a silent type error becomes a
# wrong dollar figure. The rest of the tree is checked, not policed.
[[tool.mypy.overrides]]
module = "crewsim.engine.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
